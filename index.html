<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rotas FCV - Acompanhamento ao Vivo</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        :root {
            --bg-color: #000000;
            --container-bg: #0d0d0d;
            --text-color: #ffffff;
            --box-bg: #161616;
            --border-color: #262626;
            --accent-color: #00a6fb;
        }

        body.light-mode {
            --bg-color: #f4f6f9;
            --container-bg: #ffffff;
            --text-color: #333333;
            --box-bg: #eef2f5;
            --border-color: #cccccc;
            --accent-color: #0077b6;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            transition: background 0.3s ease, color 0.3s ease;
        }

        /* CABEÇALHO */
        .header {
            background-color: var(--container-bg);
            padding: 12px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            z-index: 1000;
        }

        .header h1 {
            font-size: 18px;
            margin: 0;
            color: #4caf50;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-theme {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 5px 10px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 12px;
        }

        /* SELETOR DE ROTAS */
        .route-picker {
            background-color: var(--container-bg);
            padding: 10px 15px;
            border-bottom: 1px solid var(--border-color);
            z-index: 1000;
        }

        .route-picker select {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            background: var(--box-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            font-size: 14px;
            font-weight: bold;
            outline: none;
        }

        /* MAPA */
        #map {
            flex: 1;
            width: 100%;
            z-index: 1;
        }

        /* BARRA DE STATUS INFERIOR */
        .status-card {
            background-color: var(--container-bg);
            padding: 15px;
            border-top: 1px solid var(--border-color);
            font-size: 13px;
            line-height: 1.5;
            z-index: 1000;
        }

        .status-badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: bold;
        }

        .status-online { background-color: #2e7d32; color: #fff; }
        .status-offline { background-color: #c62828; color: #fff; }

        .alert-box {
            background-color: #ff9800;
            color: #000;
            padding: 8px;
            border-radius: 6px;
            font-weight: bold;
            margin-top: 8px;
            display: none;
        }

        /* RODAPÉ */
        .footer {
            background-color: var(--container-bg);
            padding: 8px;
            text-align: center;
            border-top: 1px solid var(--border-color);
            font-size: 10px;
            opacity: 0.6;
        }

        /* ÍCONES CUSTOMIZADOS NO MAPA */
        .bus-marker-icon {
            text-align: center;
            font-size: 24px;
        }

        .stop-marker-icon {
            background-color: #00a6fb;
            border: 2px solid white;
            border-radius: 50%;
            width: 12px !important;
            height: 12px !important;
        }
    </style>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>

    <div class="header">
        <h1>🚌 Rotas FCV</h1>
        <button id="themeBtn" class="btn-theme">💡 Super OLED</button>
    </div>

    <div class="route-picker">
        <select id="routeSelect">
            <option value="plantao">📍 Rota de Plantão</option>
            <option value="rota_01">🚌 Rota 01 (GSH-5A89)</option>
            <option value="rota_02">🚌 Rota 02 (GFH-8D02)</option>
            <option value="rota_03">🚌 Rota 03 (GFH-8D01)</option>
        </select>
    </div>

    <div id="map"></div>

    <div class="status-card" id="statusCard">
        <div><b>Veículo:</b> <span id="infoNome">Carregando...</span></div>
        <div><b>Status:</b> <span id="infoStatus" class="status-badge status-offline">OFFLINE</span></div>
        <div><b>Velocidade:</b> <span id="infoVelocidade">0 km/h</span></div>
        <div class="alert-box" id="alertBox"></div>
    </div>

    <div class="footer">
        Desenvolvido por Althieres Dias
    </div>

    <script>
        // Configuração do Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyCDmRsBA8z08E3mbf4EUHIO8Rb02pV5Bcg",
            authDomain: "rotasfcv.firebaseapp.com",
            databaseURL: "https://rotasfcv-default-rtdb.firebaseio.com",
            projectId: "rotasfcv",
            storageBucket: "rotasfcv.firebasestorage.app",
            messagingSenderId: "235141426187",
            appId: "1:235141426187:web:2092de8f43081bb2a4eb0e"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Lista de pontos EXCLUSIVA da Rota de Plantão (Adicione as coordenadas dos seus pontos aqui)
        const pontosPlantao = [
            { nome: "Ponto 1 - Centro", lat: -21.2333, lng: -42.3667 },
            { nome: "Ponto 2 - Praça", lat: -21.2350, lng: -42.3680 }
        ];

        // Inicialização do Mapa (Coordenadas iniciais ajustáveis)
        const map = L.map('map').setView([-21.2333, -42.3667], 14);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        // Camadas para organização dos marcadores
        const camadaOnibus = L.layerGroup().addTo(map);
        const camadaPontos = L.layerGroup().addTo(map);

        let marcadorOnibus = null;
        let rotaSelecionada = "plantao";

        // Elementos da Interface
        const routeSelect = document.getElementById('routeSelect');
        const infoNome = document.getElementById('infoNome');
        const infoStatus = document.getElementById('infoStatus');
        const infoVelocidade = document.getElementById('infoVelocidade');
        const alertBox = document.getElementById('alertBox');
        const themeBtn = document.getElementById('themeBtn');

        // Alternador de Tema (Super OLED / Claro)
        themeBtn.addEventListener('click', () => {
            document.body.classList.toggle('light-mode');
            const isLight = document.body.classList.contains('light-mode');
            themeBtn.innerText = isLight ? "💡 Modo Claro" : "💡 Super OLED";
        });

        // 1. REGISTRO DE PASSAGEIRO ONLINE (Presença)
        const passageiroRef = db.ref('passageiros_online').push();
        passageiroRef.set(true);
        passageiroRef.onDisconnect().remove();

        // 2. DESENHAR PONTOS NO MAPA (APENAS SE FOR A ROTA DE PLANTÃO)
        function atualizarPontosNoMapa() {
            camadaPontos.clearLayers();

            if (rotaSelecionada === 'plantao') {
                pontosPlantao.forEach(ponto => {
                    const iconePonto = L.divIcon({
                        className: 'stop-marker-icon',
                        iconSize: [12, 12]
                    });

                    L.marker([ponto.lat, ponto.lng], { icon: iconePonto })
                        .bindPopup(`<b>${ponto.nome}</b>`)
                        .addTo(camadaPontos);
                });
            }
        }

        // 3. MONITORAMENTO DA ROTA SELECIONADA EM TEMPO REAL
        function escutarRota() {
            db.ref(`onibus/${rotaSelecionada}`).on('value', (snapshot) => {
                const dados = snapshot.val();
                const agora = Date.now();
                const limiteInatividade = 5 * 60 * 1000; // 5 minutos (300.000 ms)

                // Verifica se há dados e se o último sinal foi enviado há menos de 5 minutos
                if (!dados || !dados.ativo || (agora - (dados.ultimaAtualizacao || 0) > limiteInatividade)) {
                    // SE PASSOU DE 5 MINUTOS OU FICOU INATIVO:
                    infoNome.innerText = routeSelect.options[routeSelect.selectedIndex].text;
                    infoStatus.innerText = "OFFLINE";
                    infoStatus.className = "status-badge status-offline";
                    infoVelocidade.innerText = "0 km/h";
                    alertBox.style.display = "none";

                    camadaOnibus.clearLayers();
                    marcadorOnibus = null;
                    return;
                }

                // CASO O ÔNIBUS ESTEJA ATIVO E TRANSMITINDO RECENTEMENTE:
                infoNome.innerText = `${dados.nome} (${dados.placa || 'Sem placa'})`;
                infoStatus.innerText = "EM CIRCULAÇÃO";
                infoStatus.className = "status-badge status-online";
                infoVelocidade.innerText = `${dados.velocidade || 0} km/h`;

                // Alertas de ocorrência manual (Trânsito/Defeito)
                if (dados.ocorrenciaManual === 'acidente') {
                    alertBox.innerText = "⚠️ Atenção: Trânsito ou acidente relatado à frente!";
                    alertBox.style.display = "block";
                } else if (dados.ocorrenciaManual === 'quebrado') {
                    alertBox.innerText = "🔧 Atenção: Veículo com problemas técnicos!";
                    alertBox.style.display = "block";
                } else {
                    alertBox.style.display = "none";
                }

                // Atualizar posição do ícone do ônibus no mapa
                const latLng = [dados.lat, dados.lng];

                if (!marcadorOnibus) {
                    const busIcon = L.divIcon({
                        html: '🚌',
                        className: 'bus-marker-icon',
                        iconSize: [30, 30]
                    });

                    marcadorOnibus = L.marker(latLng, { icon: busIcon }).addTo(camadaOnibus);
                    map.setView(latLng, 15); // Centraliza no ônibus ao carregar
                } else {
                    marcadorOnibus.setLatLng(latLng);
                }
            });
        }

        // ALTERAÇÃO DE ROTA PELO USUÁRIO
        routeSelect.addEventListener('change', (e) => {
            // Remove o listener da rota antiga
            db.ref(`onibus/${rotaSelecionada}`).off();
            
            rotaSelecionada = e.target.value;
            camadaOnibus.clearLayers();
            marcadorOnibus = null;

            atualizarPontosNoMapa();
            escutarRota();
        });

        // INICIALIZAÇÃO
        atualizarPontosNoMapa();
        escutarRota();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rotas FCV - Acompanhe seu Ônibus</title>
    
    <!-- Leaflet CSS (Mapa Gratuito) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: Arial, sans-serif; }
        #map { height: 100vh; width: 100%; }
        .info-box {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: rgba(0, 0, 0, 0.8);
            color: #fff;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }
    </style>

    <!-- Firebase SDK (v8) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>

    <div class="info-box" id="info">Aguardando sinal do ônibus...</div>
    <div id="map"></div>

    <script>
        // Suas configurações do Firebase rotasfcv
        const firebaseConfig = {
            apiKey: "AIzaSyCDmRsBA8z08E3mbf4EUHIO8Rb02pV5Bcg",
            authDomain: "rotasfcv.firebaseapp.com",
            databaseURL: "https://rotasfcv-default-rtdb.firebaseio.com",
            projectId: "rotasfcv",
            storageBucket: "rotasfcv.firebasestorage.app",
            messagingSenderId: "235141426187",
            appId: "1:123456789:web:2092de8f43081bb2a4eb0e"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Inicializa o mapa centralizado no Brasil
        const map = L.map('map').setView([-20.91, -42.50], 13);

        // Adiciona as imagens do mapa via OpenStreetMap
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap'
        }).addTo(map);

        let busMarker = null;
        let centralizou = false;

        // Ouve o Firebase em tempo real
        db.ref('onibus/linha_01').on('value', (snapshot) => {
            const data = snapshot.val();
            
            if (data) {
                const { lat, lng, velocidade } = data;
                const pos = [lat, lng];

                document.getElementById('info').innerText = 
                    `🚌 Ônibus Linha 01 | Velocidade: ${velocidade || 0} km/h`;

                if (!busMarker) {
                    // Cria o marcador na primeira localização recebida
                    busMarker = L.marker(pos).addTo(map).bindPopup("<b>Ônibus em Movimento</b>");
                } else {
                    // Atualiza a posição do marcador no mapa suavemente
                    busMarker.setLatLng(pos);
                }

                // Centraliza o mapa no ônibus na primeira vez
                if (!centralizou) {
                    map.setView(pos, 15);
                    centralizou = true;
                }
            } else {
                document.getElementById('info').innerText = "Ônibus Offline";
            }
        });
    </script>
</body>
</html>

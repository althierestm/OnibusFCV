<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rotas FCV - Passageiro</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        :root {
            --bg-color: #000000; /* Super OLED Pure Black */
            --container-bg: #0d0d0d;
            --text-color: #ffffff;
            --box-bg: #161616;
            --border-color: #262626;
            --accent-color: #00a6fb;
            --map-tiles-filter: invert(100%) hue-rotate(180deg) brightness(95%) contrast(90%);
        }

        body.light-mode {
            --bg-color: #f4f6f9;
            --container-bg: #ffffff;
            --text-color: #333333;
            --box-bg: #eef2f5;
            --border-color: #cccccc;
            --accent-color: #0077b6;
            --map-tiles-filter: none;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background-color: var(--container-bg);
            padding: 18px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.8);
            box-sizing: border-box;
            text-align: center;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        h2 {
            margin: 0;
            color: var(--accent-color);
            font-size: 20px;
        }

        .btn-theme {
            background: var(--box-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .btn-theme:active {
            transform: scale(0.95);
        }

        .status-card {
            background-color: var(--box-bg);
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 12px;
            font-size: 13px;
            line-height: 1.5;
            border: 1px solid var(--border-color);
        }

        .status-badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 12px;
        }

        .status-live {
            background-color: rgba(76, 175, 80, 0.2);
            color: #4caf50;
            border: 1px solid #4caf50;
        }

        .status-off {
            background-color: rgba(244, 67, 54, 0.2);
            color: #f44336;
            border: 1px solid #f44336;
        }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 12px;
        }

        .info-box {
            background: var(--box-bg);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            font-size: 12px;
        }

        .info-box span {
            display: block;
            font-size: 16px;
            font-weight: bold;
            color: var(--accent-color);
            margin-top: 4px;
        }

        #map {
            width: 100%;
            height: 320px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            margin-bottom: 15px;
            z-index: 1;
        }

        /* Aplica o filtro escuro nas tiles do mapa no modo OLED */
        .leaflet-tile-pane {
            filter: var(--map-tiles-filter);
        }

        /* Rodapé */
        .footer {
            margin-top: 15px;
            padding-top: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-top: 1px solid var(--border-color);
        }

        .footer-logo {
            max-width: 95px;
            height: auto;
            opacity: 0.85;
            transition: opacity 0.3s ease;
        }

        .footer-logo:hover {
            opacity: 1;
        }

        .footer-credit {
            font-size: 8px;
            color: var(--text-color);
            opacity: 0.4;
            margin-top: 4px;
            text-transform: none;
            letter-spacing: 0.3px;
        }
    </style>

    <!-- Firebase Scripts -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>

    <div class="container">
        <div class="top-bar">
            <h2>🚌 Rota FCV</h2>
            <button id="themeBtn" class="btn-theme">
                <span id="themeIcon">💡</span>
                <span id="themeText">Super OLED</span>
            </button>
        </div>

        <div class="status-card" id="statusCard">
            Status: <span class="status-badge status-off" id="statusBadge">Aguardando ônibus...</span>
        </div>

        <div class="info-grid">
            <div class="info-box">
                👥 Passageiros
                <span id="passCount">--</span>
            </div>
            <div class="info-box">
                ⚡ Velocidade
                <span id="speedCount">-- km/h</span>
            </div>
        </div>

        <div id="map"></div>

        <!-- RODAPÉ -->
        <div class="footer">
            <img src="https://raw.githubusercontent.com/althierestm/OnibusFCV/main/logo.png.webp" alt="Logo FCV" class="footer-logo">
            <div class="footer-credit">by Althieres Dias</div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCDmRsBA8z08E3mbf4EUHIO8Rb02pV5Bcg",
            authDomain: "rotasfcv.firebaseapp.com",
            databaseURL: "https://rotasfcv-default-rtdb.firebaseio.com",
            projectId: "rotasfcv",
            storageBucket: "rotasfcv.firebasestorage.app",
            messagingSenderId: "235141426187",
            appId: "1:235141426187:web:2092de8f43081bb2a4eb0e"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Registro de presença do passageiro online
        const sessionRef = db.ref('passageiros_online').push();
        sessionRef.set(true);
        sessionRef.onDisconnect().remove();

        // Inicialização do Mapa
        const map = L.map('map').setView([-20.914, -42.502], 14); // Posição inicial padrão

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        let busMarker = null;

        // Ícone personalizado para o ônibus
        const busIcon = L.icon({
            iconUrl: 'https://cdn-icons-png.flaticon.com/512/3448/3448339.png',
            iconSize: [38, 38],
            iconAnchor: [19, 19]
        });

        // Alternador de Tema (Super OLED / Claro) com Ícone de Lâmpada
        const themeBtn = document.getElementById('themeBtn');
        const themeIcon = document.getElementById('themeIcon');
        const themeText = document.getElementById('themeText');

        themeBtn.addEventListener('click', () => {
            document.body.classList.toggle('light-mode');
            const isLight = document.body.classList.contains('light-mode');
            
            themeIcon.innerText = isLight ? "💡" : "💡";
            themeText.innerText = isLight ? "Modo Claro" : "Super OLED";
        });

        // Monitoramento da linha do ônibus no Firebase
        db.ref('onibus/linha_01').on('value', (snapshot) => {
            const data = snapshot.val();

            const statusBadge = document.getElementById('statusBadge');
            const passCount = document.getElementById('passCount');
            const speedCount = document.getElementById('speedCount');

            if (data && data.lat && data.lng) {
                const pos = [data.lat, data.lng];

                if (!busMarker) {
                    busMarker = L.marker(pos, { icon: busIcon }).addTo(map);
                } else {
                    busMarker.setLatLng(pos);
                }

                map.panTo(pos);

                statusBadge.innerText = "EM TRÂNSITO";
                statusBadge.className = "status-badge status-live";

                passCount.innerText = data.passageiros !== undefined ? data.passageiros : 0;
                speedCount.innerText = `${data.velocidade || 0} km/h`;
            } else {
                if (busMarker) {
                    map.removeLayer(busMarker);
                    busMarker = null;
                }

                statusBadge.innerText = "OFFLINE";
                statusBadge.className = "status-badge status-off";

                passCount.innerText = "--";
                speedCount.innerText = "-- km/h";
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motorista - Onibus FCV</title>
    <link rel="manifest" href="manifest-motorista.json">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }

        .card {
            background: #1e1e1e;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 340px;
        }

        .status {
            font-size: 16px;
            font-weight: bold;
            margin: 15px 0;
            padding: 12px;
            border-radius: 12px;
            background: #333;
        }

        .active {
            background: #2196F3;
            color: #fff;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            margin-bottom: 10px;
        }

        .btn-start { background-color: #2196F3; color: white; }
        .btn-stop { background-color: #f44336; color: white; display: none; }

        /* Botões de Seleção de Status */
        .status-container {
            display: none;
            flex-direction: column;
            gap: 8px;
            margin-top: 15px;
            margin-bottom: 15px;
        }

        .btn-status {
            padding: 10px;
            border-radius: 8px;
            border: 2px solid transparent;
            font-weight: bold;
            cursor: pointer;
            color: #fff;
            opacity: 0.6;
            transition: 0.2s;
        }

        .btn-status.selected {
            opacity: 1;
            border-color: #ffffff;
            transform: scale(1.02);
        }

        .st-normal { background-color: #2e7d32; }
        .st-lento { background-color: #f57c00; }
        .st-parado { background-color: #c62828; }

        .info {
            font-size: 12px;
            color: #aaa;
            margin-top: 10px;
            line-height: 1.4;
        }
    </style>

    <!-- Firebase SDK (v8) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

    <div class="card">
        <h2>🚌 Motorista - FCV</h2>
        <div id="status" class="status">GPS Desconectado</div>
        
        <button id="startBtn" class="btn btn-start">▶ Iniciar Transmissão</button>
        <button id="stopBtn" class="btn btn-stop">⏹ Parar Transmissão</button>

        <!-- Seletor de Condição da Via -->
        <div id="statusContainer" class="status-container">
            <span style="font-size: 13px; color: #ccc;"><b>Condição da Via:</b></span>
            <button id="stNormal" class="btn-status st-normal selected">🟢 Em Rota Normal</button>
            <button id="stLento" class="btn-status st-lento">🟡 Trânsito Lento</button>
            <button id="stParado" class="btn-status st-parado">🔴 Parado / Intervalo</button>
        </div>

        <div class="info" id="details">
            Otimizado: envia a cada 100m ou 2min.
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCDmRsBA8z08E3mbf4EUHIO8Rb02pV5Bcg",
            authDomain: "rotasfcv.firebaseapp.com",
            databaseURL: "https://rotasfcv-default-rtdb.firebaseio.com",
            projectId: "rotasfcv",
            storageBucket: "rotasfcv.firebasestorage.app",
            messagingSenderId: "235141426187",
            appId: "1:235141426187:web:2092de8f43081bb2a4eb0e"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let watchId = null;
        let ultimaLat = null;
        let ultimaLng = null;
        let ultimoTempoEnvio = 0;
        let statusTransito = "normal"; // normal, lento, parado

        const DISTANCIA_MINIMA_METROS = 100;
        const TEMPO_MAXIMO_PARADO_MS = 120000;

        const statusEl = document.getElementById('status');
        const detailsEl = document.getElementById('details');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const statusContainer = document.getElementById('statusContainer');

        const stNormalBtn = document.getElementById('stNormal');
        const stLentoBtn = document.getElementById('stLento');
        const stParadoBtn = document.getElementById('stParado');

        function selecionarStatus(novoStatus, btnClicado) {
            statusTransito = novoStatus;
            [stNormalBtn, stLentoBtn, stParadoBtn].forEach(b => b.classList.remove('selected'));
            btnClicado.classList.add('selected');

            // Força o envio imediato da atualização do status para o Firebase
            if (ultimaLat !== null && ultimaLng !== null) {
                enviarParaFirebase(ultimaLat, ultimaLng, 0, true);
            }
        }

        stNormalBtn.addEventListener('click', () => selecionarStatus("normal", stNormalBtn));
        stLentoBtn.addEventListener('click', () => selecionarStatus("lento", stLentoBtn));
        stParadoBtn.addEventListener('click', () => selecionarStatus("parado", stParadoBtn));

        function calcularDistanciaMetros(lat1, lon1, lat2, lon2) {
            const R = 6371000;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        function enviarParaFirebase(lat, lng, velocidade, forcar = false) {
            ultimaLat = lat;
            ultimaLng = lng;
            ultimoTempoEnvio = Date.now();

            db.ref('onibus/linha_01').set({
                lat: lat,
                lng: lng,
                velocidade: velocidade,
                statusTransito: statusTransito,
                timestamp: firebase.database.ServerValue.TIMESTAMP
            }).then(() => {
                const hora = new Date().toLocaleTimeString();
                detailsEl.innerHTML = `Último envio às <b>${hora}</b><br>Velocidade: <b>${velocidade} km/h</b>`;
            });
        }

        function processarEEnviarPosicao(position) {
            const lat = position.coords.latitude;
            const lng = position.coords.longitude;
            const velocidade = Math.round((position.coords.speed || 0) * 3.6);
            const agora = Date.now();

            if (ultimaLat === null || ultimaLng === null) {
                enviarParaFirebase(lat, lng, velocidade);
            } else {
                const distanciaAndada = calcularDistanciaMetros(ultimaLat, ultimaLng, lat, lng);
                const tempoDecorrido = agora - ultimoTempoEnvio;

                if (distanciaAndada >= DISTANCIA_MINIMA_METROS || tempoDecorrido >= TEMPO_MAXIMO_PARADO_MS) {
                    enviarParaFirebase(lat, lng, velocidade);
                }
            }
        }

        startBtn.addEventListener('click', () => {
            if ("geolocation" in navigator) {
                watchId = navigator.geolocation.watchPosition((position) => {
                    statusEl.innerText = "📡 Transmitindo GPS...";
                    statusEl.classList.add('active');
                    startBtn.style.display = 'none';
                    stopBtn.style.display = 'block';
                    statusContainer.style.display = 'flex';

                    processarEEnviarPosicao(position);
                }, (err) => {
                    alert("Erro no GPS: " + err.message);
                }, { enableHighAccuracy: true });
            }
        });

        stopBtn.addEventListener('click', () => {
            if (watchId !== null) {
                navigator.geolocation.clearWatch(watchId);
                watchId = null;
            }
            db.ref('onibus/linha_01').remove();

            statusEl.innerText = "GPS Desconectado";
            statusEl.classList.remove('active');
            startBtn.style.display = 'block';
            stopBtn.style.display = 'none';
            statusContainer.style.display = 'none';
            detailsEl.innerText = "Transmissão pausada.";

            ultimaLat = null;
            ultimaLng = null;
        });
    </script>
</body>
</html>

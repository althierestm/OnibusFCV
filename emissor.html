    function customConfirm(msg, callback) {
        document.getElementById("customConfirmMsg").innerText = msg;
        const modal = document.getElementById("customConfirmModal");
        const btnOk = document.getElementById("customConfirmBtnOk");
        const btnCancel = document.getElementById("customConfirmBtnCancel");
        modal.style.display = "flex";
        btnOk.onclick = () => { modal.style.display = "none"; callback(true); };
        btnCancel.onclick = () => { modal.style.display = "none"; callback(false); };
    }

    const loginOverlay = document.getElementById("loginOverlay");
    const loginForm = document.getElementById("loginForm");
    const driverSelect = document.getElementById("driverSelect");
    const passwordInput = document.getElementById("passwordInput");
    const loginError = document.getElementById("loginError");
    const displayDriverName = document.getElementById("displayDriverName");
    let motoristaLogado = null;

    function carregarSessaoMotorista() {
        const dados = sessionStorage.getItem("fcv_motorista_dados");
        if (dados) {
            motoristaLogado = JSON.parse(dados);
            displayDriverName.innerText = motoristaLogado.nome;
            loginOverlay.style.display = "none";
        }
    }
    carregarSessaoMotorista();

    loginForm.addEventListener("submit", (e) => {
        e.preventDefault();
        const idSelec = driverSelect.value;
        const senhaDig = passwordInput.value.trim().toLowerCase();
        const motObj = motoristasCadastrados[idSelec];

        if (motObj && motObj.senha === senhaDig) {
            loginError.style.display = "none";
            motoristaLogado = { id: idSelec, nome: motObj.nome };
            sessionStorage.setItem("fcv_motorista_dados", JSON.stringify(motoristaLogado));
            displayDriverName.innerText = motObj.nome;
            loginOverlay.style.display = "none";
        } else {
            loginError.style.display = "block";
            passwordInput.value = "";
        }
    });

    function fazerTrocaMotorista() {
        if (isTransmitting) {
            customAlert("Finalize a transmissão atual antes de trocar de motorista!");
            return;
        }
        sessionStorage.removeItem("fcv_motorista_dados");
        motoristaLogado = null;
        loginOverlay.style.display = "flex";
    }

    const firebaseConfig = {
        apiKey: "AIzaSyCDmRsBA8z08E3mbf4EUHIO8Rb02pV5Bcg",
        authDomain: "rotasfcv.firebaseapp.com",
        databaseURL: "https://rotasfcv-default-rtdb.firebaseio.com",
        projectId: "rotasfcv",
        storageBucket: "rotasfcv.firebasestorage.app",
        messagingSenderId: "235141426187",
        appId: "1:235141426187:web:2092de8f43081bb2a4eb0e"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let isTransmitting = false;
    let watchId = null;
    let ocorrenciaAtual = null;
    let viagemAtualId = null;
    let currentRouteKey = null;
    let timerInterval = null;
    let clockInterval = null;
    let tempoInicioViagem = null;
    let lastSignalTimeout = null;
    let wakeLock = null;
    let ultimoTempoEnvio = 0;

    const toggleBtn = document.getElementById("toggleBtn");
    const btnAOD = document.getElementById("btnAOD");
    const statusText = document.getElementById("statusText");
    const routeSelect = document.getElementById("routeSelect");
    const btnAccident = document.getElementById("btnAccident");
    const btnBroken = document.getElementById("btnBroken");
    const onlinePassCountEl = document.getElementById("onlinePassCount");
    const themeBtn = document.getElementById("themeBtn");
    const themeText = document.getElementById("themeText");
    const todayHistoryListEl = document.getElementById("todayHistoryList");
    const oldHistoryListEl = document.getElementById("oldHistoryList");
    const oldHistoryDetails = document.getElementById("oldHistoryDetails");
    const oldHistoryCount = document.getElementById("oldHistoryCount");

    setInterval(() => {
        db.ref("onibus").once("value", (snap) => {
            const data = snap.val() || {};
            const agora = Date.now();
            const limite = 90000;
            Object.keys(data).forEach((key) => {
                const item = data[key];
                if (item && (item.ativo || item.emUso) && key !== currentRouteKey) {
                    const ult = item.ultimaAtualizacao || 0;
                    if (agora - ult > limite) {
                        db.ref("onibus/" + key).update({ ativo: false, emUso: false });
                    }
                }
            });
        });
    }, 30000);

    function limparTodasRotasEmergencia() {
        customConfirm("Deseja encerrar e remover do mapa TODOS os ônibus ativos no momento?", (conf) => {
            if (conf) {
                db.ref("onibus").once("value", (snap) => {
                    const data = snap.val() || {};
                    Object.keys(data).forEach((key) => {
                        db.ref("onibus/" + key).update({ ativo: false, emUso: false });
                    });
                    customAlert("Todas as rotas foram desativadas e removidas do mapa!");
                });
            }
        });
    }

    db.ref("onibus").on("value", (snap) => {
        const rotasStatus = snap.val() || {};
        Array.from(routeSelect.options).forEach((opt) => {
            const key = opt.value;
            const dados = rotasStatus[key];
            const nomeBase = opt.getAttribute("data-nome");
            const horaBase = opt.getAttribute("data-hora");
            if (dados && (dados.ativo || dados.emUso) && key !== currentRouteKey) {
                opt.disabled = true;
                opt.innerText = `(EM ROTA) ${nomeBase} - ${horaBase}`;
            } else {
                opt.disabled = false;
                opt.innerText = `${nomeBase} - ${horaBase}`;
            }
        });
    });

    async function requestWakeLock() {
        try {
            if ("wakeLock" in navigator) wakeLock = await navigator.wakeLock.request("screen");
        } catch (err) {
            console.error("Erro Wake Lock: " + err.message);
        }
    }

    function releaseWakeLock() {
        if (wakeLock !== null) {
            wakeLock.release();
            wakeLock = null;
        }
    }

    document.addEventListener("visibilitychange", async () => {
        if (isTransmitting && document.visibilityState === "visible") await requestWakeLock();
    });

    themeBtn.addEventListener("click", () => {
        document.body.classList.toggle("light-mode");
        const isLight = document.body.classList.contains("light-mode");
        themeText.innerText = isLight ? "Modo Claro" : "Super OLED";
    });

    db.ref("passageiros_online").on("value", (snap) => {
        const count = snap.numChildren() || 0;
        onlinePassCountEl.innerText = count;
        document.getElementById("aodPassengersCount").innerText = "Passageiros com App aberto: " + count;
    });

    function formatarTempo(segundos) {
        const h = Math.floor(segundos / 3600).toString().padStart(2, "0");
        const m = Math.floor((segundos % 3600) / 60).toString().padStart(2, "0");
        const s = Math.floor(segundos % 60).toString().padStart(2, "0");
        return `${h}:${m}:${s}`;
    }

    function formatarDataEDiaSemana(ts) {
        if (!ts) return "";
        const d = new Date(ts);
        const dias = ["Dom", "Seg", "Ter", "Qua", "Qui", "Sex", "Sáb"];
        return `${dias[d.getDay()]}, ${d.getDate().toString().padStart(2, "0")}/${(d.getMonth() + 1).toString().padStart(2, "0")}`;
    }

    function ehHoje(ts) {
        if (!ts) return false;
        const d = new Date(ts);
        const hoje = new Date();
        return d.getDate() === hoje.getDate() && d.getMonth() === hoje.getMonth() && d.getFullYear() === hoje.getFullYear();
    }

    function atualizarCronometroLocal() {
        if (!tempoInicioViagem) return "00:00:00";
        return formatarTempo(Math.floor((Date.now() - tempoInicioViagem) / 1000));
    }

    function resetarInatividadeTimer() {
        if (lastSignalTimeout) clearTimeout(lastSignalTimeout);
        lastSignalTimeout = setTimeout(() => {
            customAlert("Sem sinal de GPS há 5 minutos. A corrida foi finalizada automaticamente.");
            pararTransmissao();
        }, 300000);
    }

    function limparHistoricoAntigo(data) {
        const trintaDias = 30 * 24 * 60 * 60 * 1000;
        const agora = Date.now();
        Object.keys(data).forEach((key) => {
            const item = data[key];
            const ts = item.inicio || item.fim;
            if (ts && agora - ts > trintaDias) db.ref("historico_viagens/" + key).remove();
        });
    }

    db.ref("historico_viagens").on("value", (snap) => {
        const data = snap.val();
        if (!data) {
            todayHistoryListEl.innerHTML = "<div class='history-item'>Nenhuma viagem registrada hoje.</div>";
            oldHistoryDetails.style.display = "none";
            return;
        }
        limparHistoricoAntigo(data);
        let htmlHoje = "";
        let htmlAntigos = "";
        let cHoje = 0;
        let cAntigos = 0;
        const keys = Object.keys(data).reverse();

        keys.forEach((key) => {
            const item = data[key];
            const dtFmt = formatarDataEDiaSemana(item.inicio);
            const inc = item.inicio ? new Date(item.inicio).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) : "--:--";
            const eH = ehHoje(item.inicio);
            const nmRot = item.rotaNome || "Rota Não Especificada";
            const cdCor = item.codigoViagem ? "#" + item.codigoViagem : "";
            let itemHtml = "";

            if (!item.fim) {
                const tmp = atualizarCronometroLocal();
                itemHtml = `<div class='history-item'><b>${dtFmt}</b> [${nmRot}] <span style='color:var(--accent-color); font-weight:bold;'>${cdCor}</span> - <b class='badge-live'>EM ANDAMENTO</b> (desde ${inc})<br>👤 Motorista: <b>${item.motoristaNome || "N/I"}</b> | Duração: <b id='histCronometro'>${tmp}</b></div>`;
            } else {
                const fm = new Date(item.fim).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
                const dur = formatarTempo(Math.floor((item.fim - item.inicio) / 1000));
                itemHtml = `<div class='history-item'><b>${dtFmt}</b> [${nmRot}] <span style='color:var(--accent-color); font-weight:bold;'>${cdCor}</span> - <b>${inc} às ${fm}</b> (${dur})<br>👤 Motorista: <b>${item.motoristaNome || "N/I"}</b></div>`;
            }

            if (eH) {
                cHoje++;
                if (cHoje <= 5) htmlHoje += itemHtml;
                else { htmlAntigos += itemHtml; cAntigos++; }
            } else {
                htmlAntigos += itemHtml;
                cAntigos++;
            }
        });

        todayHistoryListEl.innerHTML = htmlHoje || "<div class='history-item'>Nenhuma viagem registrada hoje.</div>";
        if (cAntigos > 0) {
            oldHistoryListEl.innerHTML = htmlAntigos;
            oldHistoryCount.innerText = cAntigos;
            oldHistoryDetails.style.display = "block";
        } else {
            oldHistoryDetails.style.display = "none";
        }
    });

    btnAccident.addEventListener("click", () => toggleOcorrencia("acidente", btnAccident, "Deseja relatar Trânsito / Acidente à frente?"));
    btnBroken.addEventListener("click", () => toggleOcorrencia("quebrado", btnBroken, "Deseja relatar Ônibus com Defeito?"));

    function toggleOcorrencia(tipo, elem, msg) {
        if (ocorrenciaAtual === tipo) {
            ocorrenciaAtual = null;
            elem.classList.remove("active");
            atualizarDadosFirebase();
        } else {
            customConfirm(msg, (conf) => {
                if (!conf) return;
                ocorrenciaAtual = tipo;
                btnAccident.classList.remove("active");
                btnBroken.classList.remove("active");
                elem.classList.add("active");
                atualizarDadosFirebase();
            });
        }
    }

    toggleBtn.addEventListener("click", () => {
        if (!isTransmitting) iniciarTransmissao();
        else pararTransmissao();
    });

    function iniciarTransmissao() {
        if ("geolocation" in navigator) {
            const opt = routeSelect.options[routeSelect.selectedIndex];
            if (opt.disabled) {
                customAlert("Esta rota já está sendo utilizada por outro motorista no momento!");
                return;
            }
            currentRouteKey = routeSelect.value;
            const nm = opt.getAttribute("data-nome");
            const hr = opt.getAttribute("data-hora");

            routeSelect.disabled = true;
            tempoInicioViagem = Date.now();
            ultimoTempoEnvio = 0;
            requestWakeLock();

            db.ref("onibus/" + currentRouteKey).update({
                ativo: true,
                emUso: true,
                motoristaNome: motoristaLogado ? motoristaLogado.nome : "Não Informado",
                ultimaAtualizacao: firebase.database.ServerValue.TIMESTAMP
            });

            db.ref("onibus/" + currentRouteKey + "/ativo").onDisconnect().set(false);
            db.ref("onibus/" + currentRouteKey + "/emUso").onDisconnect().set(false);

            db.ref("contador_corridas").transaction((val) => (val || 0) + 1, (err, comm, snap) => {
                const seq = snap.val() || 1;
                const cd = String(seq).padStart(5, "0");
                const ref = db.ref("historico_viagens").push();
                viagemAtualId = ref.key;

                ref.set({
                    inicio: firebase.database.ServerValue.TIMESTAMP,
                    rotaKey: currentRouteKey,
                    rotaNome: nm,
                    hora: hr,
                    codigoViagem: cd,
                    motoristaId: motoristaLogado ? motoristaLogado.id : "mot_anonimo",
                    motoristaNome: motoristaLogado ? motoristaLogado.nome : "Motorista Não Identificado"
                });

                db.ref("historico_viagens/" + viagemAtualId + "/fim").onDisconnect().set(firebase.database.ServerValue.TIMESTAMP);
            });

            timerInterval = setInterval(() => {
                const tmp = atualizarCronometroLocal();
                const e1 = document.getElementById("liveTimer");
                const e2 = document.getElementById("histCronometro");
                if (e1) e1.innerText = tmp;
                if (e2) e2.innerText = tmp;
            }, 1000);

            resetarInatividadeTimer();

            watchId = navigator.geolocation.watchPosition((pos) => {
                resetarInatividadeTimer();
                const lat = pos.coords.latitude;
                const lng = pos.coords.longitude;
                const spd = Math.round((pos.coords.speed || 0) * 3.6);
                const agora = Date.now();
                let st = "normal";
                if (spd < 5) st = "parado";
                else if (spd < 18) st = "lento";

                if (agora - ultimoTempoEnvio >= 8000 || ocorrenciaAtual) {
                    db.ref("onibus/" + currentRouteKey).set({
                        nome: nm,
                        hora: hr,
                        lat: lat,
                        lng: lng,
                        velocidade: spd,
                        statusTransito: st,
                        ocorrenciaManual: ocorrenciaAtual,
                        ativo: true,
                        emUso: true,
                        motoristaNome: motoristaLogado ? motoristaLogado.nome : "Não Informado",
                        ultimaAtualizacao: firebase.database.ServerValue.TIMESTAMP
                    });

                    if (viagemAtualId) {
                        db.ref("historico_viagens/" + viagemAtualId + "/pontosTrajeto").push({
                            lat: lat,
                            lng: lng,
                            velocidade: spd,
                            ocorrencia: ocorrenciaAtual,
                            timestamp: firebase.database.ServerValue.TIMESTAMP
                        });
                    }
                    ultimoTempoEnvio = agora;
                }

                statusText.innerHTML = `<b>${nm} - ${hr}</b><br>Status: <b style='color: #4caf50;'>TRANSMITINDO</b><br>Velocidade: <b>${spd} km/h</b><div class='timer-display'><span id='liveTimer'>${atualizarCronometroLocal()}</span></div>`;
            }, (err) => {
                customAlert("Erro ao obter localização: " + err.message);
            }, { enableHighAccuracy: true });

            isTransmitting = true;
            toggleBtn.innerText = "Parar Transmissão";
            toggleBtn.classList.remove("btn-start");
            toggleBtn.classList.add("btn-stop");
            btnAOD.style.display = "block";
        } else {
            customAlert("Geolocalização não é suportada neste navegador.");
        }
    }

    function pararTransmissao() {
        releaseWakeLock();
        desativarAOD();
        if (watchId !== null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
        if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
        if (lastSignalTimeout) { clearTimeout(lastSignalTimeout); lastSignalTimeout = null; }

        if (viagemAtualId) {
            db.ref("historico_viagens/" + viagemAtualId + "/fim").onDisconnect().cancel();
            db.ref("historico_viagens/" + viagemAtualId).update({ fim: firebase.database.ServerValue.TIMESTAMP });
            viagemAtualId = null;
        }

        if (currentRouteKey) {
            db.ref("onibus/" + currentRouteKey + "/ativo").onDisconnect().cancel();
            db.ref("onibus/" + currentRouteKey + "/emUso").onDisconnect().cancel();
            db.ref("onibus/" + currentRouteKey).update({ ativo: false, emUso: false });
        }

        isTransmitting = false;
        tempoInicioViagem = null;
        routeSelect.disabled = false;
        statusText.innerHTML = "Status: <b style='color: #f44336;'>OFFLINE</b>";
        toggleBtn.innerText = "Iniciar Transmissão";
        toggleBtn.classList.remove("btn-stop");
        toggleBtn.classList.add("btn-start");
        btnAOD.style.display = "none";
    }

    function atualizarDadosFirebase() {
        if (isTransmitting && currentRouteKey) {
            db.ref("onibus/" + currentRouteKey).update({
                ocorrenciaManual: ocorrenciaAtual,
                ultimaAtualizacao: firebase.database.ServerValue.TIMESTAMP
            });
        }
    }

    function ativarAOD() {
        const opt = routeSelect.options[routeSelect.selectedIndex];
        const nm = opt.getAttribute("data-nome");
        const hr = opt.getAttribute("data-hora");
        document.getElementById("aodRouteName").innerText = `${nm} - ${hr}`;
        document.getElementById("aodOverlay").style.display = "flex";
        atualizarRelogioAOD();
        clockInterval = setInterval(atualizarRelogioAOD, 1000);
    }

    function desativarAOD() {
        document.getElementById("aodOverlay").style.display = "none";
        if (clockInterval) { clearInterval(clockInterval); clockInterval = null; }
    }

    function atualizarRelogioAOD() {
        const agora = new Date();
        const h = String(agora.getHours()).padStart(2, "0");
        const m = String(agora.getMinutes()).padStart(2, "0");
        document.getElementById("aodClock").innerText = `${h}:${m}`;
        const elem = document.getElementById("aodContent");
        const offset = agora.getMinutes() % 5;
        elem.style.transform = `translateY(${offset}px)`;
    }

    if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("sw.js")
            .then(() => console.log("Service Worker ativado."))
            .catch((err) => console.error("Erro no Service Worker:", err));
    }
</script>

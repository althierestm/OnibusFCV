<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Motorista - FCV</title>
    
    <style>
        :root {
            --bg-color: #000000; /* Super OLED Pure Black */
            --container-bg: #0d0d0d;
            --text-color: #ffffff;
            --box-bg: #161616;
            --border-color: #262626;
        }

        body.light-mode {
            --bg-color: #f4f6f9;
            --container-bg: #ffffff;
            --text-color: #333333;
            --box-bg: #eef2f5;
            --border-color: #cccccc;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: background 0.3s ease, color 0.3s ease;
        }

        .container {
            width: 100%;
            max-width: 400px;
            background-color: var(--container-bg);
            padding: 20px;
            border-radius: 15px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.8);
            box-sizing: border-box;
            text-align: center;
            position: relative;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        h2 { margin: 0; color: #4caf50; font-size: 20px; }

        .btn-theme {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 5px 10px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
        }

        .status-box {
            background-color: var(--box-bg);
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 15px;
            font-size: 14px;
            line-height: 1.5;
            border: 1px solid var(--border-color);
        }

        .timer-display {
            font-size: 18px;
            font-weight: bold;
            color: #ff9800;
            margin-top: 5px;
        }

        .online-app-box {
            background-color: #051923;
            border: 1px solid #003554;
            color: #00a6fb;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 13px;
            font-weight: bold;
        }

        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 12px;
            transition: all 0.2s ease;
        }

        .btn-start { background-color: #2e7d32; color: white; }
        .btn-stop { background-color: #c62828; color: white; }

        .counter-section {
            background: var(--box-bg);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
        }

        .counter-title { font-size: 14px; margin-bottom: 10px; opacity: 0.8; }
        .counter-controls { display: flex; justify-content: space-between; align-items: center; }
        
        .btn-count {
            width: 50px;
            height: 50px;
            font-size: 24px;
            border-radius: 50%;
            border: 1px solid var(--border-color);
            background: #222;
            color: #fff;
            cursor: pointer;
        }

        .count-display { font-size: 26px; font-weight: bold; color: #00a6fb; }

        .incident-section { margin-top: 10px; }
        .incident-title { font-size: 13px; opacity: 0.8; margin-bottom: 8px; text-align: left; }
        
        .btn-incident {
            background-color: var(--box-bg);
            color: var(--text-color);
            padding: 10px;
            font-size: 13px;
            border: 1px solid var(--border-color);
        }

        .btn-incident.active {
            background-color: #ff9800;
            color: #000;
        }

        .history-section {
            margin-top: 25px;
            text-align: left;
            background: var(--box-bg);
            padding: 12px;
            border-radius: 10px;
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid var(--border-color);
        }

        .history-title {
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 8px;
            color: #00a6fb;
        }

        .history-item {
            font-size: 11px;
            padding: 6px 0;
            border-bottom: 1px solid var(--border-color);
            line-height: 1.4;
        }

        .badge-live {
            color: #4caf50;
            font-weight: bold;
            animation: blink 1s infinite alternate;
        }

        @keyframes blink {
            from { opacity: 1; }
            to { opacity: 0.4; }
        }

        /* ESTILO DO RODAPÉ */
        .footer {
            margin-top: 25px;
            padding-top: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            border-top: 1px solid var(--border-color);
        }

        .footer-logo {
            max-width: 100px;
            height: auto;
            opacity: 0.85;
            transition: opacity 0.3s ease;
        }

        .footer-logo:hover {
            opacity: 1;
        }

        .footer-credit {
            font-size: 8px;
            color: var(--text-color);
            opacity: 0.4;
            margin-top: 3px;
            text-transform: none; /* Mantém letras minúsculas/normais */
            text-align: center;
            letter-spacing: 0.3px;
        }
    </style>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

    <div class="container">
        <div class="top-bar">
            <h2>🚌 Motorista</h2>
            <button id="themeBtn" class="btn-theme">🖤 Super OLED</button>
        </div>

        <div class="status-box" id="statusText">
            Status: <b style="color: #f44336;">OFFLINE</b>
        </div>

        <div class="online-app-box">
            📱 Passageiros com o App Aberto: <span id="onlinePassCount">0</span>
        </div>

        <button id="toggleBtn" class="btn btn-start">▶ Iniciar Transmissão</button>

        <div class="counter-section">
            <div class="counter-title">👥 Passageiros no Ônibus</div>
            <div class="counter-controls">
                <button class="btn-count" id="btnMinus">-</button>
                <span class="count-display" id="passCount">0</span>
                <button class="btn-count" id="btnPlus">+</button>
            </div>
        </div>

        <div class="incident-section">
            <div class="incident-title">Relatar Ocorrência:</div>
            <button class="btn btn-incident" id="btnAccident">⚠️ Trânsito / Acidente à Frente</button>
            <button class="btn btn-incident" id="btnBroken">🔧 Ônibus com Defeito</button>
        </div>

        <div class="history-section">
            <div class="history-title">📜 Histórico de Viagens Recentes</div>
            <div id="historyList">Carregando histórico...</div>
        </div>

        <!-- RODAPÉ -->
        <div class="footer">
            <img src="https://raw.githubusercontent.com/althierestm/OnibusFCV/main/logo.png.webp" alt="Logo FCV" class="footer-logo">
            <div class="footer-credit">by Althieres Dias</div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCDmRsBA8z08E3mbf4EUHIO8Rb02pV5Bcg",
            authDomain: "rotasfcv.firebaseapp.com",
            databaseURL: "https://rotasfcv-default-rtdb.firebaseio.com",
            projectId: "rotasfcv",
            storageBucket: "rotasfcv.firebasestorage.app",
            messagingSenderId: "235141426187",
            appId: "1:235141426187:web:2092de8f43081bb2a4eb0e"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let isTransmitting = false;
        let watchId = null;
        let qtdPassageiros = 0;
        let ocorrenciaAtual = null;
        let viagemAtualId = null;
        
        let timerInterval = null;
        let tempoInicioViagem = null;

        const toggleBtn = document.getElementById('toggleBtn');
        const statusText = document.getElementById('statusText');
        const passCountEl = document.getElementById('passCount');
        const btnPlus = document.getElementById('btnPlus');
        const btnMinus = document.getElementById('btnMinus');
        const btnAccident = document.getElementById('btnAccident');
        const btnBroken = document.getElementById('btnBroken');
        const onlinePassCountEl = document.getElementById('onlinePassCount');
        const themeBtn = document.getElementById('themeBtn');
        const historyListEl = document.getElementById('historyList');

        // Alternador de Tema (Super OLED / Claro)
        themeBtn.addEventListener('click', () => {
            document.body.classList.toggle('light-mode');
            const isLight = document.body.classList.contains('light-mode');
            themeBtn.innerText = isLight ? "☀️ Claro" : "🖤 Super OLED";
        });

        // Monitora passageiros online
        db.ref('passageiros_online').on('value', (snapshot) => {
            const totalOnline = snapshot.numChildren() || 0;
            onlinePassCountEl.innerText = totalOnline;
        });

        function formatarTempo(segundos) {
            const h = Math.floor(segundos / 3600).toString().padStart(2, '0');
            const m = Math.floor((segundos % 3600) / 60).toString().padStart(2, '0');
            const s = Math.floor(segundos % 60).toString().padStart(2, '0');
            return `${h}:${m}:${s}`;
        }

        function formatarDataEDiaSemana(timestamp) {
            if (!timestamp) return '';
            const data = new Date(timestamp);
            const dias = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
            const diaSemana = dias[data.getDay()];
            const dia = data.getDate().toString().padStart(2, '0');
            const mes = (data.getMonth() + 1).toString().padStart(2, '0');
            return `${diaSemana}, ${dia}/${mes}`;
        }

        function atualizarCronometroLocal() {
            if (!tempoInicioViagem) return "00:00:00";
            const agora = Date.now();
            const decorridoSeg = Math.floor((agora - tempoInicioViagem) / 1000);
            return formatarTempo(decorridoSeg);
        }

        // Carrega o Histórico de Viagens
        db.ref('historico_viagens').limitToLast(10).on('value', (snapshot) => {
            const data = snapshot.val();
            if (!data) {
                historyListEl.innerHTML = "<div class='history-item'>Nenhuma viagem registrada ainda.</div>";
                return;
            }
            let html = "";
            const keys = Object.keys(data).reverse();
            keys.forEach(key => {
                const item = data[key];
                const dataFormatada = formatarDataEDiaSemana(item.inicio);
                const inicio = item.inicio ? new Date(item.inicio).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : '--:--';
                
                if (item.fim) {
                    const fim = new Date(item.fim).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                    const duracaoSeg = Math.floor((item.fim - item.inicio) / 1000);
                    const duracaoStr = formatarTempo(duracaoSeg);
                    html += `
                        <div class="history-item">
                            <b>📅 ${dataFormatada}</b> - <b>🏁 ${inicio} às ${fim}</b> (${duracaoStr})<br>
                            👥 Passageiros: <b>${item.passageirosFinal || 0}</b>
                        </div>
                    `;
                } else {
                    const tempoAtualStr = atualizarCronometroLocal();
                    html += `
                        <div class="history-item">
                            <b>📅 ${dataFormatada}</b> - <b class="badge-live">🟢 EM ANDAMENTO</b> (desde ${inicio})<br>
                            ⏱️ Duração: <b id="histCronometro">${tempoAtualStr}</b> | 👥 Passageiros: <b>${item.passageirosFinal || 0}</b>
                        </div>
                    `;
                }
            });
            historyListEl.innerHTML = html;
        });

        // Controles do Contador
        btnPlus.addEventListener('click', () => {
            qtdPassageiros++;
            passCountEl.innerText = qtdPassageiros;
            atualizarDadosFirebase();
        });

        btnMinus.addEventListener('click', () => {
            if (qtdPassageiros > 0) {
                qtdPassageiros--;
                passCountEl.innerText = qtdPassageiros;
                atualizarDadosFirebase();
            }
        });

        // Ocorrências
        btnAccident.addEventListener('click', () => toggleOcorrencia('acidente', btnAccident, "Deseja relatar Trânsito / Acidente à frente?"));
        btnBroken.addEventListener('click', () => toggleOcorrencia('quebrado', btnBroken, "Deseja relatar Ônibus com Defeito?"));

        function toggleOcorrencia(tipo, botao, mensagemConfirmacao) {
            if (ocorrenciaAtual === tipo) {
                ocorrenciaAtual = null;
                botao.classList.remove('active');
            } else {
                if (!confirm(mensagemConfirmacao)) return;
                ocorrenciaAtual = tipo;
                btnAccident.classList.remove('active');
                btnBroken.classList.remove('active');
                botao.classList.add('active');
            }
            atualizarDadosFirebase();
        }

        toggleBtn.addEventListener('click', () => {
            if (!isTransmitting) iniciarTransmissao();
            else pararTransmissao();
        });

        function iniciarTransmissao() {
            if ("geolocation" in navigator) {
                tempoInicioViagem = Date.now();
                
                const novaViagemRef = db.ref('historico_viagens').push();
                viagemAtualId = novaViagemRef.key;
                novaViagemRef.set({
                    inicio: firebase.database.ServerValue.TIMESTAMP,
                    passageirosInicial: qtdPassageiros,
                    passageirosFinal: qtdPassageiros
                });

                // Inicia o Cronômetro
                timerInterval = setInterval(() => {
                    const tempoStr = atualizarCronometroLocal();
                    const cronoEl = document.getElementById('liveTimer');
                    const histCronoEl = document.getElementById('histCronometro');
                    
                    if (cronoEl) cronoEl.innerText = tempoStr;
                    if (histCronoEl) histCronoEl.innerText = tempoStr;
                }, 1000);

                watchId = navigator.geolocation.watchPosition((pos) => {
                    const lat = pos.coords.latitude;
                    const lng = pos.coords.longitude;
                    const speedKmh = Math.round((pos.coords.speed || 0) * 3.6);

                    let statusTransito = "normal";
                    if (speedKmh < 5) statusTransito = "parado";
                    else if (speedKmh < 18) statusTransito = "lento";

                    db.ref('onibus/linha_01').set({
                        lat: lat,
                        lng: lng,
                        velocidade: speedKmh,
                        statusTransito: statusTransito,
                        ocorrenciaManual: ocorrenciaAtual,
                        passageiros: qtdPassageiros,
                        ultimaAtualizacao: firebase.database.ServerValue.TIMESTAMP
                    });

                    statusText.innerHTML = `
                        Status: <b style="color: #4caf50;">TRANSMITINDO</b><br>
                        Velocidade: <b>${speedKmh} km/h</b>
                        <div class="timer-display">⏱️ <span id="liveTimer">${atualizarCronometroLocal()}</span></div>
                    `;
                }, (err) => {
                    alert("Erro ao obter localização: " + err.message);
                }, { enableHighAccuracy: true });

                isTransmitting = true;
                toggleBtn.innerText = "⏹ Parar Transmissão";
                toggleBtn.classList.remove('btn-start');
                toggleBtn.classList.add('btn-stop');
            } else {
                alert("Geolocalização não é suportada neste navegador.");
            }
        }

        function pararTransmissao() {
            if (watchId !== null) {
                navigator.geolocation.clearWatch(watchId);
                watchId = null;
            }

            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }

            if (viagemAtualId) {
                db.ref(`historico_viagens/${viagemAtualId}`).update({
                    fim: firebase.database.ServerValue.TIMESTAMP,
                    passageirosFinal: qtdPassageiros
                });
                viagemAtualId = null;
            }

            db.ref('onibus/linha_01').remove();
            isTransmitting = false;
            tempoInicioViagem = null;

            statusText.innerHTML = `Status: <b style="color: #f44336;">OFFLINE</b>`;
            toggleBtn.innerText = "▶ Iniciar Transmissão";
            toggleBtn.classList.remove('btn-stop');
            toggleBtn.classList.add('btn-start');
        }

        function atualizarDadosFirebase() {
            if (isTransmitting) {
                db.ref('onibus/linha_01').update({
                    passageiros: qtdPassageiros,
                    ocorrenciaManual: ocorrenciaAtual
                });

                if (viagemAtualId) {
                    db.ref(`historico_viagens/${viagemAtualId}`).update({
                        passageirosFinal: qtdPassageiros
                    });
                }
            }
        }
    </script>
</body>
</html>

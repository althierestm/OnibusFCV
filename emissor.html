<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Motorista - FCV</title>
    
    <style>
        :root {
            --bg-color: #121212;
            --container-bg: #1e1e1e;
            --text-color: #ffffff;
            --box-bg: #2a2a2a;
            --border-color: #444;
        }

        body.light-mode {
            --bg-color: #f4f6f9;
            --container-bg: #ffffff;
            --text-color: #333333;
            --box-bg: #eef2f5;
            --border-color: #cccccc;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: background 0.3s ease, color 0.3s ease;
        }

        .container {
            width: 100%;
            max-width: 400px;
            background-color: var(--container-bg);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            box-sizing: border-box;
            text-align: center;
            position: relative;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        h2 { margin: 0; color: #4caf50; font-size: 20px; }

        .btn-theme {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 5px 10px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
        }

        .status-box {
            background-color: var(--box-bg);
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 15px;
            font-size: 14px;
            line-height: 1.5;
        }

        .online-app-box {
            background-color: #0d2b45;
            border: 1px solid #1769aa;
            color: #64b5f6;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 13px;
            font-weight: bold;
        }

        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 12px;
            transition: all 0.2s ease;
        }

        .btn-start { background-color: #4caf50; color: white; }
        .btn-stop { background-color: #f44336; color: white; }

        .counter-section {
            background: var(--box-bg);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .counter-title { font-size: 14px; margin-bottom: 10px; opacity: 0.8; }
        .counter-controls { display: flex; justify-content: space-between; align-items: center; }
        
        .btn-count {
            width: 50px;
            height: 50px;
            font-size: 24px;
            border-radius: 50%;
            border: none;
            background: #444;
            color: #fff;
            cursor: pointer;
        }

        .count-display { font-size: 26px; font-weight: bold; color: #2196f3; }

        .incident-section { margin-top: 10px; }
        .incident-title { font-size: 13px; opacity: 0.8; margin-bottom: 8px; text-align: left; }
        
        .btn-incident {
            background-color: var(--box-bg);
            color: var(--text-color);
            padding: 10px;
            font-size: 13px;
            border: 1px solid var(--border-color);
        }

        .btn-incident.active {
            background-color: #ff9800;
            color: #000;
        }

        .history-section {
            margin-top: 25px;
            text-align: left;
            background: var(--box-bg);
            padding: 12px;
            border-radius: 10px;
            max-height: 180px;
            overflow-y: auto;
        }

        .history-title {
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 8px;
            color: #2196f3;
        }

        .history-item {
            font-size: 11px;
            padding: 6px 0;
            border-bottom: 1px solid var(--border-color);
            line-height: 1.4;
        }
    </style>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

    <div class="container">
        <div class="top-bar">
            <h2>🚌 Motorista</h2>
            <button id="themeBtn" class="btn-theme">🌙 Escuro</button>
        </div>

        <div class="status-box" id="statusText">
            Status: <b style="color: #f44336;">OFFLINE</b>
        </div>

        <div class="online-app-box">
            📱 Passageiros com o App Aberto: <span id="onlinePassCount">0</span>
        </div>

        <button id="toggleBtn" class="btn btn-start">▶ Iniciar Transmissão</button>

        <div class="counter-section">
            <div class="counter-title">👥 Passageiros no Ônibus</div>
            <div class="counter-controls">
                <button class="btn-count" id="btnMinus">-</button>
                <span class="count-display" id="passCount">0</span>
                <button class="btn-count" id="btnPlus">+</button>
            </div>
        </div>

        <div class="incident-section">
            <div class="incident-title">Relatar Ocorrência:</div>
            <button class="btn btn-incident" id="btnAccident">⚠️ Trânsito / Acidente à Frente</button>
            <button class="btn btn-incident" id="btnBroken">🔧 Ônibus com Defeito</button>
        </div>

        <div class="history-section">
            <div class="history-title">📜 Histórico de Viagens Recentes</div>
            <div id="historyList">Carregando histórico...</div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCDmRsBA8z08E3mbf4EUHIO8Rb02pV5Bcg",
            authDomain: "rotasfcv.firebaseapp.com",
            databaseURL: "https://rotasfcv-default-rtdb.firebaseio.com",
            projectId: "rotasfcv",
            storageBucket: "rotasfcv.firebasestorage.app",
            messagingSenderId: "235141426187",
            appId: "1:235141426187:web:2092de8f43081bb2a4eb0e"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let isTransmitting = false;
        let watchId = null;
        let qtdPassageiros = 0;
        let ocorrenciaAtual = null;
        let viagemAtualId = null;

        const toggleBtn = document.getElementById('toggleBtn');
        const statusText = document.getElementById('statusText');
        const passCountEl = document.getElementById('passCount');
        const btnPlus = document.getElementById('btnPlus');
        const btnMinus = document.getElementById('btnMinus');
        const btnAccident = document.getElementById('btnAccident');
        const btnBroken = document.getElementById('btnBroken');
        const onlinePassCountEl = document.getElementById('onlinePassCount');
        const themeBtn = document.getElementById('themeBtn');
        const historyListEl = document.getElementById('historyList');

        // Alternador de Tema (Modo Escuro / Claro)
        themeBtn.addEventListener('click', () => {
            document.body.classList.toggle('light-mode');
            const isLight = document.body.classList.contains('light-mode');
            themeBtn.innerText = isLight ? "☀️ Claro" : "🌙 Escuro";
        });

        // Monitora passageiros no app do passageiro
        db.ref('passageiros_online').on('value', (snapshot) => {
            const totalOnline = snapshot.numChildren() || 0;
            onlinePassCountEl.innerText = totalOnline;
        });

        // Carrega o Histórico de Viagens
        db.ref('historico_viagens').limitToLast(10).on('value', (snapshot) => {
            const data = snapshot.val();
            if (!data) {
                historyListEl.innerHTML = "<div class='history-item'>Nenhuma viagem registrada ainda.</div>";
                return;
            }
            let html = "";
            const keys = Object.keys(data).reverse();
            keys.forEach(key => {
                const item = data[key];
                const inicio = item.inicio ? new Date(item.inicio).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : '--:--';
                const fim = item.fim ? new Date(item.fim).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : 'Em andamento';
                html += `
                    <div class="history-item">
                        <b>🏁 Viagem ${inicio} - ${fim}</b><br>
                        👥 Passageiros: <b>${item.passageirosFinal || 0}</b>
                    </div>
                `;
            });
            historyListEl.innerHTML = html;
        });

        // Controles do Contador
        btnPlus.addEventListener('click', () => {
            qtdPassageiros++;
            passCountEl.innerText = qtdPassageiros;
            atualizarDadosFirebase();
        });

        btnMinus.addEventListener('click', () => {
            if (qtdPassageiros > 0) {
                qtdPassageiros--;
                passCountEl.innerText = qtdPassageiros;
                atualizarDadosFirebase();
            }
        });

        // Ocorrências com confirmação
        btnAccident.addEventListener('click', () => toggleOcorrencia('acidente', btnAccident, "Deseja relatar Trânsito / Acidente à frente?"));
        btnBroken.addEventListener('click', () => toggleOcorrencia('quebrado', btnBroken, "Deseja relatar Ônibus com Defeito?"));

        function toggleOcorrencia(tipo, botao, mensagemConfirmacao) {
            if (ocorrenciaAtual === tipo) {
                ocorrenciaAtual = null;
                botao.classList.remove('active');
            } else {
                const confirmou = confirm(mensagemConfirmacao);
                if (!confirmou) return;

                ocorrenciaAtual = tipo;
                btnAccident.classList.remove('active');
                btnBroken.classList.remove('active');
                botao.classList.add('active');
            }
            atualizarDadosFirebase();
        }

        toggleBtn.addEventListener('click', () => {
            if (!isTransmitting) {
                iniciarTransmissao();
            } else {
                pararTransmissao();
            }
        });

        function iniciarTransmissao() {
            if ("geolocation" in navigator) {
                // Inicia registro no histórico
                const novaViagemRef = db.ref('historico_viagens').push();
                viagemAtualId = novaViagemRef.key;
                novaViagemRef.set({
                    inicio: firebase.database.ServerValue.TIMESTAMP,
                    passageirosInicial: qtdPassageiros
                });

                watchId = navigator.geolocation.watchPosition((pos) => {
                    const lat = pos.coords.latitude;
                    const lng = pos.coords.longitude;
                    const speedKmh = Math.round((pos.coords.speed || 0) * 3.6);

                    let statusTransito = "normal";
                    if (speedKmh < 5) statusTransito = "parado";
                    else if (speedKmh < 18) statusTransito = "lento";

                    db.ref('onibus/linha_01').set({
                        lat: lat,
                        lng: lng,
                        velocidade: speedKmh,
                        statusTransito: statusTransito,
                        ocorrenciaManual: ocorrenciaAtual,
                        passageiros: qtdPassageiros,
                        ultimaAtualizacao: firebase.database.ServerValue.TIMESTAMP
                    });

                    statusText.innerHTML = `Status: <b style="color: #4caf50;">TRANSMITINDO</b><br>Velocidade: <b>${speedKmh} km/h</b>`;
                }, (err) => {
                    alert("Erro ao obter localização: " + err.message);
                }, { enableHighAccuracy: true });

                isTransmitting = true;
                toggleBtn.innerText = "⏹ Parar Transmissão";
                toggleBtn.classList.remove('btn-start');
                toggleBtn.classList.add('btn-stop');
            } else {
                alert("Geolocalização não é suportada neste navegador.");
            }
        }

        function pararTransmissao() {
            if (watchId !== null) {
                navigator.geolocation.clearWatch(watchId);
                watchId = null;
            }

            // Finaliza registro no histórico
            if (viagemAtualId) {
                db.ref(`historico_viagens/${viagemAtualId}`).update({
                    fim: firebase.database.ServerValue.TIMESTAMP,
                    passageirosFinal: qtdPassageiros
                });
                viagemAtualId = null;
            }

            db.ref('onibus/linha_01').remove();
            isTransmitting = false;
            statusText.innerHTML = `Status: <b style="color: #f44336;">OFFLINE</b>`;
            toggleBtn.innerText = "▶ Iniciar Transmissão";
            toggleBtn.classList.remove('btn-stop');
            toggleBtn.classList.add('btn-start');
        }

        function atualizarDadosFirebase() {
            if (isTransmitting) {
                db.ref('onibus/linha_01').update({
                    passageiros: qtdPassageiros,
                    ocorrenciaManual: ocorrenciaAtual
                });

                if (viagemAtualId) {
                    db.ref(`historico_viagens/${viagemAtualId}`).update({
                        passageirosFinal: qtdPassageiros
                    });
                }
            }
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Emissor de Rota - FCV</title>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        :root {
            --bg-dark: #121212;
            --card-bg: #1e1e1e;
            --accent-blue: #00a6fb;
            --danger-red: #ff5252;
            --warning-orange: #ff9800;
            --text-main: #ffffff;
            --text-sub: #aaaaaa;
            --border-color: #333333;
        }

        * { box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0; padding: 20px;
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%; max-width: 420px;
            background: var(--card-bg);
            padding: 20px; border-radius: 16px;
            border: 1px solid var(--border-color);
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        h2 { margin-top: 0; font-size: 20px; color: var(--accent-blue); }

        label {
            font-size: 12px; color: var(--text-sub);
            display: block; text-align: left; margin-top: 10px; margin-bottom: 4px;
        }

        select, input {
            width: 100%; padding: 12px; margin-bottom: 10px;
            border-radius: 8px; border: 1px solid var(--border-color);
            background: #2a2a2a; color: #fff; font-size: 14px; outline: none;
        }

        .btn {
            width: 100%; padding: 14px; margin-top: 8px;
            border: none; border-radius: 8px;
            font-size: 15px; font-weight: bold; cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn:active { opacity: 0.8; }
        .btn-start { background: #4caf50; color: #fff; }
        .btn-stop { background: var(--danger-red); color: #fff; display: none; }
        .btn-aod { background: #262626; color: var(--accent-blue); border: 1px solid var(--accent-blue); display: none; }
        
        .incident-panel {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid var(--border-color);
            display: none;
        }

        .btn-incident {
            background: #2b2313;
            color: var(--warning-orange);
            border: 1px solid var(--warning-orange);
            margin-top: 8px;
        }

        .status-box {
            margin-top: 15px; padding: 12px; border-radius: 8px;
            background: #262626; font-size: 13px; color: var(--text-sub);
            border: 1px solid var(--border-color);
        }

        /* TELA PRETA ECONOMIA DE BATERIA (ALWAYS ON DISPLAY) */
        #aodOverlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: #000000;
            color: #ffffff;
            z-index: 999999;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            user-select: none;
        }

        .aod-clock {
            font-size: 60px;
            font-weight: 300;
            letter-spacing: 2px;
            color: #ffffff;
        }

        .aod-route {
            font-size: 18px;
            color: var(--accent-blue);
            margin: 15px 0 5px 0;
            font-weight: 600;
        }

        .aod-passengers {
            font-size: 16px;
            color: #888888;
        }

        .aod-hint {
            position: absolute; bottom: 30px;
            font-size: 11px; color: #444;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Emissor de Rota</h2>
        
        <label for="selectRota">Selecione a Rota:</label>
        <select id="selectRota">
            <option value="Rota Centro - Bairro">Rota Centro - Bairro</option>
            <option value="Rota Bairro - Centro">Rota Bairro - Centro</option>
            <option value="Rota Universitária">Rota Universitária</option>
        </select>

        <label for="inputPlaca">Identificação do Veículo:</label>
        <input type="text" id="inputPlaca" placeholder="Placa do Veículo (ex: FCV-001)">

        <button id="btnStart" class="btn btn-start" onclick="iniciarViagem()">Iniciar Viagem</button>
        <button id="btnStop" class="btn btn-stop" onclick="encerrarViagem()">Encerrar Viagem</button>
        <button id="btnAOD" class="btn btn-aod" onclick="ativarAOD()">Modo Economia (AOD)</button>

        <!-- PAINEL DE OCORRÊNCIAS -->
        <div class="incident-panel" id="incidentPanel">
            <div style="font-size:12px; color:var(--text-sub); text-align:left; margin-bottom:5px;">Registrar Alerta no Trajeto:</div>
            <button class="btn btn-incident" onclick="registrarOcorrencia('acidente')">Trânsito / Acidente à Frente</button>
            <button class="btn btn-incident" onclick="registrarOcorrencia('defeito')">Ônibus com Defeito</button>
        </div>

        <div class="status-box" id="statusBox">Aguardando início da viagem...</div>
    </div>

    <!-- TELA ALWAYS ON DISPLAY (AOD) -->
    <div id="aodOverlay" onclick="desativarAOD()">
        <div id="aodContent">
            <div class="aod-clock" id="aodClock">00:00</div>
            <div class="aod-route" id="aodRouteName">Nome da Rota</div>
            <div class="aod-passengers" id="aodPassengersCount">Passageiros online: 0</div>
        </div>
        <div class="aod-hint">Toque em qualquer lugar para sair do modo economia</div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCDmRsBA8z08E3mbf4EUHIO8Rb02pV5Bcg",
            authDomain: "rotasfcv.firebaseapp.com",
            databaseURL: "https://rotasfcv-default-rtdb.firebaseio.com",
            projectId: "rotasfcv",
            storageBucket: "rotasfcv.firebasestorage.app",
            messagingSenderId: "235141426187",
            appId: "1:235141426187:web:2092de8f43081bb2a4eb0e"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let watchId = null;
        let viagemKey = null;
        let wakeLock = null;
        let clockInterval = null;
        let ultimaOcorrencia = null;

        // MANTER TELA ACESA (WAKE LOCK API)
        async function solicitarWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                }
            } catch (err) {
                console.log("WakeLock erro:", err);
            }
        }

        function liberarWakeLock() {
            if (wakeLock !== null) {
                wakeLock.release();
                wakeLock = null;
            }
        }

        // LEITURA EM TEMPO REAL DOS PASSAGEIROS
        function monitorarPassageiros() {
            db.ref('passageiros_online').on('value', (snapshot) => {
                const count = snapshot.val() || 0;
                document.getElementById('aodPassengersCount').innerText = `Passageiros online: ${count}`;
            });
        }

        function iniciarViagem() {
            const rota = document.getElementById('selectRota').value;
            const placa = document.getElementById('inputPlaca').value || "FCV";

            viagemKey = db.ref('historico_viagens').push().key;
            const inicioTimestamp = Date.now();

            db.ref(`historico_viagens/${viagemKey}`).set({
                rotaNome: rota,
                placa: placa,
                inicio: inicioTimestamp,
                fim: null
            });

            // Monitoramento contínuo de GPS
            if ("geolocation" in navigator) {
                watchId = navigator.geolocation.watchPosition(
                    (pos) => enviarPontoGPS(pos),
                    (err) => {
                        console.error(err);
                        document.getElementById('statusBox').innerText = "Erro ao obter GPS: " + err.message;
                    },
                    { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 }
                );
            } else {
                alert("Geolocalização não é suportada por este dispositivo.");
                return;
            }

            solicitarWakeLock();
            monitorarPassageiros();

            document.getElementById('btnStart').style.display = 'none';
            document.getElementById('btnStop').style.display = 'block';
            document.getElementById('btnAOD').style.display = 'block';
            document.getElementById('incidentPanel').style.display = 'block';
            document.getElementById('statusBox').innerText = "Rastreamento ativado e transmitindo...";
        }

        function enviarPontoGPS(pos) {
            if (!viagemKey) return;

            const speedKmh = pos.coords.speed ? Math.round(pos.coords.speed * 3.6) : 0;
            const ponto = {
                lat: pos.coords.latitude,
                lng: pos.coords.longitude,
                velocidade: speedKmh,
                timestamp: Date.now()
            };

            // Anexa ocorrência caso tenha sido registrada recentemente
            if (ultimaOcorrencia) {
                ponto.ocorrencia = ultimaOcorrencia;
                ultimaOcorrencia = null; // limpa após enviar
            }

            // Atualiza histórico e posição ao vivo
            db.ref(`historico_viagens/${viagemKey}/pontosTrajeto`).push(ponto);
            db.ref('posicao_atual').set(ponto);

            document.getElementById('statusBox').innerText = `Transmitindo - Vel: ${speedKmh} km/h`;
        }

        function registrarOcorrencia(tipo) {
            ultimaOcorrencia = tipo;
            const msg = tipo === 'acidente' ? "Trânsito/Acidente marcado!" : "Ônibus com defeito marcado!";
            alert(msg);
            document.getElementById('statusBox').innerText = `Alerta registrado: ${msg}`;
        }

        function encerrarViagem() {
            if (watchId) {
                navigator.geolocation.clearWatch(watchId);
                watchId = null;
            }

            if (viagemKey) {
                db.ref(`historico_viagens/${viagemKey}/fim`).set(Date.now());
                viagemKey = null;
            }

            liberarWakeLock();
            desativarAOD();

            document.getElementById('btnStart').style.display = 'block';
            document.getElementById('btnStop').style.display = 'none';
            document.getElementById('btnAOD').style.display = 'none';
            document.getElementById('incidentPanel').style.display = 'none';
            document.getElementById('statusBox').innerText = "Viagem encerrada com sucesso.";
        }

        // LÓGICA DO ALWAYS ON DISPLAY (AOD)
        function ativarAOD() {
            const rota = document.getElementById('selectRota').value;
            document.getElementById('aodRouteName').innerText = rota;
            document.getElementById('aodOverlay').style.display = 'flex';

            atualizarRelogio();
            clockInterval = setInterval(atualizarRelogio, 1000);
        }

        function desativarAOD() {
            document.getElementById('aodOverlay').style.display = 'none';
            if (clockInterval) {
                clearInterval(clockInterval);
                clockInterval = null;
            }
        }

        function atualizarRelogio() {
            const agora = new Date();
            const horas = String(agora.getHours()).padStart(2, '0');
            const minutos = String(agora.getMinutes()).padStart(2, '0');
            document.getElementById('aodClock').innerText = `${horas}:${minutos}`;

            // Prevenção suave de burn-in nas telas AMOLED (desloca 1px periodicamente)
            const aodContent = document.getElementById('aodContent');
            const offset = agora.getMinutes() % 5;
            aodContent.style.transform = `translateY(${offset}px)`;
        }
    </script>
</body>
</html>

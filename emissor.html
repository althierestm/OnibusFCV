<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPS FCV Motorista</title>

    <!-- Aponta para o Manifest do Motorista -->
    <link rel="manifest" href="manifest-motorista.json">
    <meta name="theme-color" content="#4caf50">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="GPS Motorista">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3448/3448339.png">

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        .card {
            background-color: #1e1e1e;
            border-radius: 16px;
            padding: 24px;
            max-width: 400px;
            margin: 20px auto;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
        }
        .status-badge {
            display: inline-block;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 20px;
            background-color: #ff9800;
            color: #000;
        }
        .online { background-color: #4caf50; color: #fff; }
        .offline { background-color: #f44336; color: #fff; }
        .info { font-size: 15px; color: #ccc; margin: 8px 0; }
        
        .wake-box {
            margin-top: 20px;
            padding: 12px;
            background-color: #2a2a2a;
            border-radius: 8px;
            border: 1px solid #333;
            font-size: 13px;
            color: #4caf50;
        }

        .btn-install {
            display: none;
            width: 100%;
            background-color: #4caf50;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            margin-top: 20px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(76, 175, 80, 0.4);
        }
        .btn-install:active {
            transform: scale(0.98);
        }
    </style>

    <!-- Firebase SDK (v8) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

    <div class="card">
        <h2>🚌 GPS FCV Motorista</h2>
        <div id="status" class="status-badge">Aguardando GPS...</div>
        
        <p class="info" id="coords">Lat: -- | Lng: --</p>
        <p class="info" id="speed">Velocidade: 0 km/h</p>
        <p class="info" id="time">Último envio: --</p>

        <div class="wake-box" id="wakeStatus">
            💡 Mantendo tela 100% acesa durante o percurso...
        </div>

        <button id="installBtn" class="btn-install">
            📲 Adicionar "GPS FCV Motorista" à Tela Inicial
        </button>
    </div>

    <script>
        // Configuração do Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyCDmRsBA8z08E3mbf4EUHIO8Rb02pV5Bcg",
            authDomain: "rotasfcv.firebaseapp.com",
            databaseURL: "https://rotasfcv-default-rtdb.firebaseio.com",
            projectId: "rotasfcv",
            storageBucket: "rotasfcv.firebasestorage.app",
            messagingSenderId: "235141426187",
            appId: "1:235141426187:web:2092de8f43081bb2a4eb0e"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const linhaId = "linha_01"; 

        const statusEl = document.getElementById("status");
        const coordsEl = document.getElementById("coords");
        const speedEl = document.getElementById("speed");
        const timeEl = document.getElementById("time");

        // 1. RECURSO: MANTER A TELA 100% LIGADA (Screen Wake Lock API)
        let wakeLock = null;
        async function keepScreenOn() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                    document.getElementById('wakeStatus').innerText = "💡 Tela BLOQUEADA PARA NÃO APAGAR durante a rota.";
                }
            } catch (err) {
                document.getElementById('wakeStatus').innerText = "⚠️ Mantenha o celular conectado ao carregador no painel.";
            }
        }
        
        // Reativa a trava da tela se o motorista alternar entre apps e voltar
        document.addEventListener('visibilitychange', () => {
            if (wakeLock !== null && document.visibilityState === 'visible') {
                keepScreenOn();
            }
        });

        keepScreenOn();

        // 2. TRANSMISSÃO DO GPS EM TEMPO REAL
        if ("geolocation" in navigator) {
            navigator.geolocation.watchPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    const speed = position.coords.speed ? (position.coords.speed * 3.6).toFixed(1) : 0; 
                    const now = new Date().toLocaleTimeString();

                    db.ref('onibus/' + linhaId).set({
                        lat: lat,
                        lng: lng,
                        velocidade: speed,
                        ultimaAtualizacao: Date.now()
                    });

                    statusEl.innerText = "TRANSMITINDO AO VIVO";
                    statusEl.className = "status-badge online";
                    coordsEl.innerText = `Lat: ${lat.toFixed(5)} | Lng: ${lng.toFixed(5)}`;
                    speedEl.innerText = `Velocidade: ${speed} km/h`;
                    timeEl.innerText = `Último envio: ${now}`;
                },
                (error) => {
                    statusEl.innerText = "Erro no GPS";
                    statusEl.className = "status-badge offline";
                    alert("Erro no GPS: " + error.message + ". Ative a localização no celular.");
                },
                {
                    enableHighAccuracy: true,
                    maximumAge: 0,
                    timeout: 10000
                }
            );
        }

        // 3. REGISTRO DO SERVICE WORKER
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }

        // 4. LÓGICA DO BOTÃO PARA INSTALAR COMO APP "GPS FCV MOTORISTA"
        let deferredPrompt;
        const installBtn = document.getElementById('installBtn');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBtn.style.display = 'block';
        });

        installBtn.addEventListener('click', () => {
            installBtn.style.display = 'none';
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then((choiceResult) => {
                    deferredPrompt = null;
                });
            }
        });
    </script>
</body>
</html>

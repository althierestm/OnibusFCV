<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Painel do Motorista - FCV</title>
    
    <style>
        :root {
            --bg-color: #000000; /* Super OLED Pure Black */
            --container-bg: #0d0d0d;
            --text-color: #ffffff;
            --box-bg: #161616;
            --border-color: #262626;
            --accent-color: #00a6fb;
        }

        body.light-mode {
            --bg-color: #f4f6f9;
            --container-bg: #ffffff;
            --text-color: #333333;
            --box-bg: #eef2f5;
            --border-color: #cccccc;
            --accent-color: #0077b6;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: background 0.3s ease, color 0.3s ease;
            touch-action: manipulation;
            -webkit-user-select: none;
            user-select: none;
        }

        .container {
            width: 100%;
            max-width: 400px;
            background-color: var(--container-bg);
            padding: 20px;
            border-radius: 15px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.8);
            box-sizing: border-box;
            text-align: center;
            position: relative;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        h2 { margin: 0; color: #4caf50; font-size: 20px; }

        .btn-theme {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 5px 10px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* SELEÇÃO DE ROTA */
        .route-selection-box {
            background-color: var(--box-bg);
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 15px;
            border: 1px solid var(--border-color);
            text-align: left;
        }

        .route-selection-box label {
            font-size: 12px;
            font-weight: bold;
            color: var(--accent-color);
            display: block;
            margin-bottom: 6px;
        }

        .route-select {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            background: var(--container-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            font-size: 14px;
            font-weight: bold;
            outline: none;
        }

        .status-box {
            background-color: var(--box-bg);
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 15px;
            font-size: 14px;
            line-height: 1.5;
            border: 1px solid var(--border-color);
        }

        .timer-display {
            font-size: 18px;
            font-weight: bold;
            color: #ff9800;
            margin-top: 5px;
        }

        .online-app-box {
            background-color: #051923;
            border: 1px solid #003554;
            color: #00a6fb;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 13px;
            font-weight: bold;
        }

        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 12px;
            transition: all 0.2s ease;
        }

        .btn-start { background-color: #2e7d32; color: white; }
        .btn-stop { background-color: #c62828; color: white; }

        .incident-section { margin-top: 10px; }
        .incident-title { font-size: 13px; opacity: 0.8; margin-bottom: 8px; text-align: left; }
        
        .btn-incident {
            background-color: var(--box-bg);
            color: var(--text-color);
            padding: 10px;
            font-size: 13px;
            border: 1px solid var(--border-color);
        }

        .btn-incident.active {
            background-color: #ff9800;
            color: #000;
        }

        .history-section {
            margin-top: 25px;
            text-align: left;
            background: var(--box-bg);
            padding: 12px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
        }

        .history-title {
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 8px;
            color: var(--accent-color);
        }

        .history-item {
            font-size: 11px;
            padding: 6px 0;
            border-bottom: 1px solid var(--border-color);
            line-height: 1.4;
        }

        .history-item:last-child {
            border-bottom: none;
        }

        .badge-live {
            color: #4caf50;
            font-weight: bold;
            animation: blink 1s infinite alternate;
        }

        @keyframes blink {
            from { opacity: 1; }
            to { opacity: 0.4; }
        }

        details.history-details {
            margin-top: 10px;
            background-color: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 6px 10px;
            font-size: 12px;
        }

        details.history-details summary {
            font-weight: bold;
            cursor: pointer;
            color: var(--text-color);
            opacity: 0.85;
            outline: none;
            padding: 4px 0;
            user-select: none;
        }

        details.history-details summary:hover {
            opacity: 1;
            color: var(--accent-color);
        }

        .history-expanded-list {
            max-height: 180px;
            overflow-y: auto;
            margin-top: 8px;
            padding-top: 5px;
            border-top: 1px solid var(--border-color);
        }

        .footer {
            margin-top: 25px;
            padding-top: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            border-top: 1px solid var(--border-color);
        }

        .footer-logo {
            max-width: 100px;
            height: auto;
            opacity: 0.85;
            transition: opacity 0.3s ease;
        }

        .footer-logo:hover {
            opacity: 1;
        }

        .footer-credit {
            font-size: 8px;
            color: var(--text-color);
            opacity: 0.4;
            margin-top: 3px;
            text-transform: none;
            text-align: center;
            letter-spacing: 0.3px;
        }
    </style>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

    <div class="container">
        <div class="top-bar">
            <h2>🚌 Motorista</h2>
            <button id="themeBtn" class="btn-theme">
                <span>💡</span>
                <span id="themeText">Super OLED</span>
            </button>
        </div>

        <!-- SELEÇÃO DE ROTA -->
        <div class="route-selection-box">
            <label for="routeSelect">📍 ROTA DE HOJE:</label>
            <select id="routeSelect" class="route-select">
                <option value="plantao" data-nome="Rota de Plantão" data-placa="FCV">📍 Rota de Plantão</option>
                <option value="rota_01" data-nome="Rota 01" data-placa="GSH-5A89">🚌 Rota 01 (GSH-5A89)</option>
                <option value="rota_02" data-nome="Rota 02" data-placa="GFH-8D02">🚌 Rota 02 (GFH-8D02)</option>
                <option value="rota_03" data-nome="Rota 03" data-placa="GFH-8D01">🚌 Rota 03 (GFH-8D01)</option>
            </select>
        </div>

        <div class="status-box" id="statusText">
            Status: <b style="color: #f44336;">OFFLINE</b>
        </div>

        <div class="online-app-box">
            📱 Passageiros com o App Aberto: <span id="onlinePassCount">0</span>
        </div>

        <button id="toggleBtn" class="btn btn-start">▶ Iniciar Transmissão</button>

        <div class="incident-section">
            <div class="incident-title">Relatar Ocorrência:</div>
            <button class="btn btn-incident" id="btnAccident">⚠️ Trânsito / Acidente à Frente</button>
            <button class="btn btn-incident" id="btnBroken">🔧 Ônibus com Defeito</button>
        </div>

        <div class="history-section">
            <div class="history-title">📜 Viagens de Hoje</div>
            <div id="todayHistoryList">Carregando viagens do dia...</div>

            <details class="history-details" id="oldHistoryDetails" style="display: none;">
                <summary>📁 Ver histórico de dias anteriores (<span id="oldHistoryCount">0</span>)</summary>
                <div class="history-expanded-list" id="oldHistoryList"></div>
            </details>
        </div>

        <div class="footer">
            <img src="https://raw.githubusercontent.com/althierestm/OnibusFCV/main/logo.png.webp" alt="Logo FCV" class="footer-logo">
            <div class="footer-credit">by Althieres Dias</div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCDmRsBA8z08E3mbf4EUHIO8Rb02pV5Bcg",
            authDomain: "rotasfcv.firebaseapp.com",
            databaseURL: "https://rotasfcv-default-rtdb.firebaseio.com",
            projectId: "rotasfcv",
            storageBucket: "rotasfcv.firebasestorage.app",
            messagingSenderId: "235141426187",
            appId: "1:235141426187:web:2092de8f43081bb2a4eb0e"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let isTransmitting = false;
        let watchId = null;
        let ocorrenciaAtual = null;
        let viagemAtualId = null;
        let currentRouteKey = null;
        
        let timerInterval = null;
        let tempoInicioViagem = null;
        let lastSignalTimeout = null; // Controle de inatividade (5 minutos)
        
        // Variavel do Bloqueio de Tela
        let wakeLock = null;

        const toggleBtn = document.getElementById('toggleBtn');
        const statusText = document.getElementById('statusText');
        const routeSelect = document.getElementById('routeSelect');
        const btnAccident = document.getElementById('btnAccident');
        const btnBroken = document.getElementById('btnBroken');
        const onlinePassCountEl = document.getElementById('onlinePassCount');
        const themeBtn = document.getElementById('themeBtn');
        const themeText = document.getElementById('themeText');
        const todayHistoryListEl = document.getElementById('todayHistoryList');
        const oldHistoryListEl = document.getElementById('oldHistoryList');
        const oldHistoryDetails = document.getElementById('oldHistoryDetails');
        const oldHistoryCount = document.getElementById('oldHistoryCount');

        // --- LÓGICA DE MANTER A TELA ACESA (SCREEN WAKE LOCK) ---
        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                    console.log('Tela configurada para permanecer ligada.');

                    wakeLock.addEventListener('release', () => {
                        console.log('Bloqueio de tela liberado.');
                    });
                }
            } catch (err) {
                console.error(`Erro ao ativar Wake Lock: ${err.name}, ${err.message}`);
            }
        }

        function releaseWakeLock() {
            if (wakeLock !== null) {
                wakeLock.release();
                wakeLock = null;
            }
        }

        // Reativa a tela acesa se o motorista alternar de aplicativo e voltar
        document.addEventListener('visibilitychange', async () => {
            if (isTransmitting && document.visibilityState === 'visible') {
                await requestWakeLock();
            }
        });
        // --------------------------------------------------------

        themeBtn.addEventListener('click', () => {
            document.body.classList.toggle('light-mode');
            const isLight = document.body.classList.contains('light-mode');
            themeText.innerText = isLight ? "Modo Claro" : "Super OLED";
        });

        db.ref('passageiros_online').on('value', (snapshot) => {
            const totalOnline = snapshot.numChildren() || 0;
            onlinePassCountEl.innerText = totalOnline;
        });

        function formatarTempo(segundos) {
            const h = Math.floor(segundos / 3600).toString().padStart(2, '0');
            const m = Math.floor((segundos % 3600) / 60).toString().padStart(2, '0');
            const s = Math.floor(segundos % 60).toString().padStart(2, '0');
            return `${h}:${m}:${s}`;
        }

        function formatarDataEDiaSemana(timestamp) {
            if (!timestamp) return '';
            const data = new Date(timestamp);
            const dias = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
            const diaSemana = dias[data.getDay()];
            const dia = data.getDate().toString().padStart(2, '0');
            const mes = (data.getMonth() + 1).toString().padStart(2, '0');
            return `${diaSemana}, ${dia}/${mes}`;
        }

        function ehHoje(timestamp) {
            if (!timestamp) return false;
            const data = new Date(timestamp);
            const hoje = new Date();
            return data.getDate() === hoje.getDate() &&
                   data.getMonth() === hoje.getMonth() &&
                   data.getFullYear() === hoje.getFullYear();
        }

        function atualizarCronometroLocal() {
            if (!tempoInicioViagem) return "00:00:00";
            const agora = Date.now();
            const decorridoSeg = Math.floor((agora - tempoInicioViagem) / 1000);
            return formatarTempo(decorridoSeg);
        }

        function resetarInatividadeTimer() {
            if (lastSignalTimeout) clearTimeout(lastSignalTimeout);
            
            // 5 minutos = 300.000 ms
            lastSignalTimeout = setTimeout(() => {
                alert("Sem sinal de GPS há 5 minutos. A transmissão foi encerrada automaticamente.");
                pararTransmissao();
            }, 300000);
        }

        function limparHistoricoAntigo(data) {
            const trintaDiasEmMs = 30 * 24 * 60 * 60 * 1000;
            const agora = Date.now();

            Object.keys(data).forEach(key => {
                const item = data[key];
                const timestampItem = item.inicio || item.fim;
                if (timestampItem && (agora - timestampItem > trintaDiasEmMs)) {
                    db.ref(`historico_viagens/${key}`).remove();
                }
            });
        }

        db.ref('historico_viagens').on('value', (snapshot) => {
            const data = snapshot.val();
            if (!data) {
                todayHistoryListEl.innerHTML = "<div class='history-item'>Nenhuma viagem registrada hoje.</div>";
                oldHistoryDetails.style.display = "none";
                return;
            }

            limparHistoricoAntigo(data);

            let htmlHoje = "";
            let htmlAnteriores = "";
            let qtdAnteriores = 0;

            const keys = Object.keys(data).reverse();

            keys.forEach(key => {
                const item = data[key];
                const dataFormatada = formatarDataEDiaSemana(item.inicio);
                const inicio = item.inicio ? new Date(item.inicio).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : '--:--';
                const eHoje = ehHoje(item.inicio);
                const nomeRota = item.rotaNome || "Rota Não Especificada";

                if (!item.fim) {
                    const tempoAtualStr = atualizarCronometroLocal();
                    const itemHtml = `
                        <div class="history-item">
                            <b>📅 ${dataFormatada}</b> [${nomeRota}] - <b class="badge-live">🟢 EM ANDAMENTO</b> (desde ${inicio})<br>
                            ⏱️ Duração: <b id="histCronometro">${tempoAtualStr}</b>
                        </div>
                    `;
                    if (eHoje) htmlHoje += itemHtml;
                    else htmlAnteriores += itemHtml;
                } else {
                    const fim = new Date(item.fim).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                    const duracaoSeg = Math.floor((item.fim - item.inicio) / 1000);
                    const duracaoStr = formatarTempo(duracaoSeg);
                    const itemHtml = `
                        <div class="history-item">
                            <b>📅 ${dataFormatada}</b> [${nomeRota}] - <b>🏁 ${inicio} às ${fim}</b> (${duracaoStr})
                        </div>
                    `;

                    if (eHoje) {
                        htmlHoje += itemHtml;
                    } else {
                        htmlAnteriores += itemHtml;
                        qtdAnteriores++;
                    }
                }
            });

            todayHistoryListEl.innerHTML = htmlHoje || "<div class='history-item'>Nenhuma viagem registrada hoje.</div>";

            if (qtdAnteriores > 0) {
                oldHistoryListEl.innerHTML = htmlAnteriores;
                oldHistoryCount.innerText = qtdAnteriores;
                oldHistoryDetails.style.display = "block";
            } else {
                oldHistoryDetails.style.display = "none";
            }
        });

        btnAccident.addEventListener('click', () => toggleOcorrencia('acidente', btnAccident, "Deseja relatar Trânsito / Acidente à frente?"));
        btnBroken.addEventListener('click', () => toggleOcorrencia('quebrado', btnBroken, "Deseja relatar Ônibus com Defeito?"));

        function toggleOcorrencia(tipo, botao, mensagemConfirmacao) {
            if (ocorrenciaAtual === tipo) {
                ocorrenciaAtual = null;
                botao.classList.remove('active');
            } else {
                if (!confirm(mensagemConfirmacao)) return;
                ocorrenciaAtual = tipo;
                btnAccident.classList.remove('active');
                btnBroken.classList.remove('active');
                botao.classList.add('active');
            }
            atualizarDadosFirebase();
        }

        toggleBtn.addEventListener('click', () => {
            if (!isTransmitting) iniciarTransmissao();
            else pararTransmissao();
        });

        function iniciarTransmissao() {
            if ("geolocation" in navigator) {
                const optionSelected = routeSelect.options[routeSelect.selectedIndex];
                currentRouteKey = routeSelect.value;
                const routeName = optionSelected.getAttribute('data-nome');
                const routePlaca = optionSelected.getAttribute('data-placa');

                routeSelect.disabled = true;
                tempoInicioViagem = Date.now();

                // Ativa o bloqueio para manter a tela acesa
                requestWakeLock();

                // Configura desativação automática no Firebase se o app/navegador fechar repentinamente
                db.ref(`onibus/${currentRouteKey}/ativo`).onDisconnect().set(false);

                const novaViagemRef = db.ref('historico_viagens').push();
                viagemAtualId = novaViagemRef.key;
                novaViagemRef.set({
                    inicio: firebase.database.ServerValue.TIMESTAMP,
                    rotaKey: currentRouteKey,
                    rotaNome: routeName
                });

                timerInterval = setInterval(() => {
                    const tempoStr = atualizarCronometroLocal();
                    const cronoEl = document.getElementById('liveTimer');
                    const histCronoEl = document.getElementById('histCronometro');
                    
                    if (cronoEl) cronoEl.innerText = tempoStr;
                    if (histCronoEl) histCronoEl.innerText = tempoStr;
                }, 1000);

                resetarInatividadeTimer();

                watchId = navigator.geolocation.watchPosition((pos) => {
                    resetarInatividadeTimer();

                    const lat = pos.coords.latitude;
                    const lng = pos.coords.longitude;
                    const speedKmh = Math.round((pos.coords.speed || 0) * 3.6);

                    let statusTransito = "normal";
                    if (speedKmh < 5) statusTransito = "parado";
                    else if (speedKmh < 18) statusTransito = "lento";

                    db.ref(`onibus/${currentRouteKey}`).set({
                        nome: routeName,
                        placa: routePlaca,
                        lat: lat,
                        lng: lng,
                        velocidade: speedKmh,
                        statusTransito: statusTransito,
                        ocorrenciaManual: ocorrenciaAtual,
                        ativo: true,
                        ultimaAtualizacao: firebase.database.ServerValue.TIMESTAMP
                    });

                    statusText.innerHTML = `
                        <b>${routeName} (${routePlaca})</b><br>
                        Status: <b style="color: #4caf50;">TRANSMITINDO</b><br>
                        Velocidade: <b>${speedKmh} km/h</b>
                        <div class="timer-display">⏱️ <span id="liveTimer">${atualizarCronometroLocal()}</span></div>
                    `;
                }, (err) => {
                    alert("Erro ao obter localização: " + err.message);
                }, { enableHighAccuracy: true });

                isTransmitting = true;
                toggleBtn.innerText = "⏹ Parar Transmissão";
                toggleBtn.classList.remove('btn-start');
                toggleBtn.classList.add('btn-stop');
            } else {
                alert("Geolocalização não é suportada neste navegador.");
            }
        }

        function pararTransmissao() {
            // Libera a tela para desligar normalmente quando a rota for finalizada
            releaseWakeLock();

            if (watchId !== null) {
                navigator.geolocation.clearWatch(watchId);
                watchId = null;
            }

            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }

            if (lastSignalTimeout) {
                clearTimeout(lastSignalTimeout);
                lastSignalTimeout = null;
            }

            if (viagemAtualId) {
                db.ref(`historico_viagens/${viagemAtualId}`).update({
                    fim: firebase.database.ServerValue.TIMESTAMP
                });
                viagemAtualId = null;
            }

            if (currentRouteKey) {
                // Remove a instrução onDisconnect pois foi desligado manualmente
                db.ref(`onibus/${currentRouteKey}/ativo`).onDisconnect().cancel();
                
                db.ref(`onibus/${currentRouteKey}`).update({
                    ativo: false
                });
            }

            isTransmitting = false;
            tempoInicioViagem = null;
            routeSelect.disabled = false;

            statusText.innerHTML = `Status: <b style="color: #f44336;">OFFLINE</b>`;
            toggleBtn.innerText = "▶ Iniciar Transmissão";
            toggleBtn.classList.remove('btn-stop');
            toggleBtn.classList.add('btn-start');
        }

        function atualizarDadosFirebase() {
            if (isTransmitting && currentRouteKey) {
                db.ref(`onibus/${currentRouteKey}`).update({
                    ocorrenciaManual: ocorrenciaAtual
                });
            }
        }
    </script>
</body>
</html>

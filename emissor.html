<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Painel do Motorista - FCV</title>
    
    <meta name="theme-color" content="#121212">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body, html { 
            margin: 0; 
            padding: 0; 
            height: 100%; 
            font-family: Arial, sans-serif; 
            background-color: #121212;
            color: #ffffff;
            touch-action: manipulation;
            -webkit-user-select: none;
            user-select: none;
        }

        #map { 
            height: 100vh; 
            width: 100%; 
            touch-action: manipulation;
        }

        /* CARD DE SELEÇÃO DE ROTA */
        .select-card {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2000;
            background: rgba(25, 25, 25, 0.95);
            -webkit-backdrop-filter: blur(15px);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 25px 20px;
            border-radius: 20px;
            width: 85%;
            max-width: 360px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        .select-card h2 {
            margin-top: 0;
            font-size: 18px;
            margin-bottom: 15px;
            color: #2196F3;
        }

        .route-option-btn {
            width: 100%;
            padding: 14px;
            margin: 6px 0;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .route-option-btn:active {
            background: #2196F3;
        }

        /* CARD SUPERIOR DE STATUS */
        .info-box {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: rgba(20, 20, 20, 0.85);
            -webkit-backdrop-filter: blur(12px);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            padding: 12px 20px;
            border-radius: 20px;
            font-size: 13px;
            line-height: 1.4;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            text-align: center;
            width: 85%;
            max-width: 360px;
        }

        /* CONTROLES INFERIORES */
        .controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: center;
            width: 90%;
            max-width: 360px;
        }

        .btn {
            width: 100%;
            border: none;
            padding: 12px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            cursor: pointer;
            transition: all 0.2s ease;
            touch-action: manipulation;
        }

        .btn-start { background-color: #4CAF50; color: #fff; }
        .btn-stop { background-color: #f44336; color: #fff; display: none; }

        .status-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 6px;
            width: 100%;
            margin-top: 4px;
        }

        .btn-status {
            background: rgba(40, 40, 40, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-status.active {
            border-color: #2196F3;
            background: #2196F3;
        }

        .btn-change-route {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ccc;
            font-size: 11px;
            padding: 6px 12px;
            border-radius: 15px;
            margin-top: 5px;
            cursor: pointer;
        }
    </style>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>

    <!-- CARD SELETOR DE ROTA INICIAL -->
    <div id="routeSelectCard" class="select-card">
        <h2>Selecione a Rota de Hoje</h2>
        <button class="route-option-btn" onclick="selecionarRota('plantao', 'Rota de Plantão', 'FCV')">
            <span>📍 Rota de Plantão</span>
            <small style="opacity:0.6;">Plantão</small>
        </button>
        <button class="route-option-btn" onclick="selecionarRota('rota_01', 'Rota 01', 'GSH-5A89')">
            <span>🚌 Rota 01</span>
            <small style="opacity:0.6;">GSH-5A89</small>
        </button>
        <button class="route-option-btn" onclick="selecionarRota('rota_02', 'Rota 02', 'GFH-8D02')">
            <span>🚌 Rota 02</span>
            <small style="opacity:0.6;">GFH-8D02</small>
        </button>
        <button class="route-option-btn" onclick="selecionarRota('rota_03', 'Rota 03', 'GFH-8D01')">
            <span>🚌 Rota 03</span>
            <small style="opacity:0.6;">GFH-8D01</small>
        </button>
    </div>

    <div class="info-box" id="infoBox">
        <b>Painel do Motorista</b><br>
        <span id="routeTitle" style="color: #ffc107;">Nenhuma rota selecionada</span>
    </div>

    <div class="controls">
        <div class="status-grid" id="statusGrid" style="display: none;">
            <button class="btn-status active" id="btnNormal" onclick="setStatusTransito('normal')">🟢 Normal</button>
            <button class="btn-status" id="btnLento" onclick="setStatusTransito('lento')">🟡 Lento</button>
            <button class="btn-status" id="btnParado" onclick="setStatusTransito('parado')">🔴 Parado</button>
        </div>

        <button id="btnStart" class="btn btn-start" style="display: none;" onclick="iniciarTransmissao()">▶️ Iniciar Transmissão</button>
        <button id="btnStop" class="btn btn-stop" onclick="pararTransmissao()">⏹️ Encerrar Rota</button>
        
        <button id="btnTrocarRota" class="btn-change-route" style="display: none;" onclick="resetarSelecao()">🔄 Trocar Rota</button>
    </div>

    <div id="map"></div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCDmRsBA8z08E3mbf4EUHIO8Rb02pV5Bcg",
            authDomain: "rotasfcv.firebaseapp.com",
            databaseURL: "https://rotasfcv-default-rtdb.firebaseio.com",
            projectId: "rotasfcv",
            storageBucket: "rotasfcv.firebasestorage.app",
            messagingSenderId: "235141426187",
            appId: "1:235141426187:web:2092de8f43081bb2a4eb0e"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // INICIALIZA O MAPA CENTRALIZADO EM MURIAÉ
        const map = L.map('map', { doubleClickZoom: false }).setView([-21.128, -42.370], 14);

        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
            attribution: '© OpenStreetMap © CARTO',
            maxZoom: 19
        }).addTo(map);

        const busIcon = L.icon({
            iconUrl: 'https://raw.githubusercontent.com/althierestm/OnibusFCV/main/Pino%20Onibus%20FCV.png',
            iconSize: [60, 60],
            iconAnchor: [30, 30],
            popupAnchor: [0, -30]
        });

        let currentRouteKey = null;
        let currentRouteName = "";
        let currentPlaca = "";
        let watchId = null;
        let busMarker = null;
        let statusTransitoAtual = "normal";

        function selecionarRota(key, nome, placa) {
            currentRouteKey = key;
            currentRouteName = nome;
            currentPlaca = placa;

            document.getElementById('routeSelectCard').style.display = 'none';
            document.getElementById('routeTitle').innerText = `${nome} (${placa})`;
            document.getElementById('btnStart').style.display = 'block';
            document.getElementById('btnTrocarRota').style.display = 'block';
            document.getElementById('statusGrid').style.display = 'grid';
        }

        function resetarSelecao() {
            if (watchId !== null) {
                alert("Encerre a transmissão da rota atual antes de trocar de rota.");
                return;
            }
            document.getElementById('routeSelectCard').style.display = 'block';
            document.getElementById('btnStart').style.display = 'none';
            document.getElementById('btnTrocarRota').style.display = 'none';
            document.getElementById('statusGrid').style.display = 'none';
            document.getElementById('routeTitle').innerText = "Nenhuma rota selecionada";
        }

        function setStatusTransito(status) {
            statusTransitoAtual = status;
            document.getElementById('btnNormal').classList.toggle('active', status === 'normal');
            document.getElementById('btnLento').classList.toggle('active', status === 'lento');
            document.getElementById('btnParado').classList.toggle('active', status === 'parado');

            if (currentRouteKey && watchId !== null) {
                db.ref(`onibus/${currentRouteKey}`).update({
                    statusTransito: statusTransitoAtual
                });
            }
        }

        function iniciarTransmissao() {
            if (!currentRouteKey) return;

            if ("geolocation" in navigator) {
                document.getElementById('btnStart').style.display = 'none';
                document.getElementById('btnStop').style.display = 'block';
                document.getElementById('btnTrocarRota').style.display = 'none';

                watchId = navigator.geolocation.watchPosition((position) => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    const speedKmh = Math.round((position.coords.speed || 0) * 3.6);

                    const busPos = [lat, lng];

                    if (!busMarker) {
                        busMarker = L.marker(busPos, { icon: busIcon }).addTo(map);
                    } else {
                        busMarker.setLatLng(busPos);
                    }

                    map.setView(busPos, 16);

                    // ATUALIZA NO FIREBASE
                    db.ref(`onibus/${currentRouteKey}`).set({
                        nome: currentRouteName,
                        placa: currentPlaca,
                        lat: lat,
                        lng: lng,
                        velocidade: speedKmh,
                        statusTransito: statusTransitoAtual,
                        ativo: true,
                        ultimaAtualizacao: firebase.database.ServerValue.TIMESTAMP
                    });

                    document.getElementById('infoBox').innerHTML = `
                        <b> Transmitindo: ${currentRouteName}</b><br>
                        Velocidade: <b>${speedKmh} km/h</b> | Status: <b>${statusTransitoAtual.toUpperCase()}</b>
                    `;
                }, (err) => {
                    alert("Erro ao obter GPS: " + err.message);
                    pararTransmissao();
                }, {
                    enableHighAccuracy: true,
                    maximumAge: 0,
                    timeout: 10000
                });
            } else {
                alert("Navegador sem suporte a Geolocalização.");
            }
        }

        function pararTransmissao() {
            if (watchId !== null) {
                navigator.geolocation.clearWatch(watchId);
                watchId = null;
            }

            if (currentRouteKey) {
                db.ref(`onibus/${currentRouteKey}`).update({
                    ativo: false
                });
            }

            if (busMarker) {
                map.removeLayer(busMarker);
                busMarker = null;
            }

            document.getElementById('btnStart').style.display = 'block';
            document.getElementById('btnStop').style.display = 'none';
            document.getElementById('btnTrocarRota').style.display = 'block';

            document.getElementById('infoBox').innerHTML = `
                <b>Transmissão Parada</b><br>
                <span style="color:#ffc107;">${currentRouteName} offline</span>
            `;
        }
    </script>
</body>
</html>

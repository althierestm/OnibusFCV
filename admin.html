<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"><title>Painel do Gestor - FCV</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script><style>:root{--bg-dark:#121212;--card-bg:#1e1e1e;--accent-blue:#00a6fb;--border-color:#333;--text-main:#fff;--text-sub:#aaa;--danger-color:#ff5252;--warning-color:#ff9800;--success-color:#4caf50}*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;margin:0;padding:0;background-color:var(--bg-dark);color:var(--text-main);height:100vh;display:flex;flex-direction:column;overflow:hidden}#loginOverlay{position:fixed;top:0;left:0;width:100%;height:100%;background:linear-gradient(135deg,#003a63 0%,#0077b6 100%);display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:99999;padding:20px}.login-box{background:var(--card-bg);padding:25px;border-radius:16px;width:100%;max-width:320px;text-align:center;box-shadow:0 10px 25px rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.1)}.login-box input{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:1px solid var(--border-color);background:#2a2a2a;color:#fff;font-size:14px;outline:none}.login-box button{width:100%;padding:12px;background:var(--accent-blue);border:none;color:#fff;font-weight:700;border-radius:8px;cursor:pointer;font-size:15px;margin-top:10px}#adminError{color:#fff;background-color:rgba(255,82,82,.2);border:1px solid var(--danger-color);border-radius:8px;padding:10px;display:none;margin-top:12px;font-size:12px;text-align:center;word-break:break-word}.header{background:var(--card-bg);padding:12px 15px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border-color);height:55px;flex-shrink:0;z-index:1000}.header h3{margin:0;font-size:16px;color:#fff}.btn-back{background:#2a2a2a;color:#fff;border:1px solid var(--border-color);padding:6px 12px;border-radius:6px;font-size:12px;font-weight:700;cursor:pointer;display:none}.main-container{display:flex;flex:1;height:calc(100vh - 55px);position:relative;overflow:hidden}.sidebar{width:340px;background:#161616;border-right:1px solid var(--border-color);padding:15px;overflow-y:auto;flex-shrink:0;z-index:100;display:flex;flex-direction:column;gap:12px}.btn-finish-all{width:100%;background:rgba(255,82,82,.15);color:var(--danger-color);border:1px solid var(--danger-color);padding:10px 12px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:6px}.btn-finish-all:hover{background:var(--danger-color);color:#fff}.date-group-btn{background:#222;border:1px solid var(--border-color);color:#fff;padding:12px 14px;border-radius:8px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:700;transition:background .2s}.date-group-btn:hover{background:#2d2d2d;border-color:var(--accent-blue)}.date-badge{background:var(--accent-blue);color:#fff;font-size:11px;padding:2px 8px;border-radius:12px}.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.7);display:none;justify-content:center;align-items:center;z-index:2000;padding:15px}.modal-box{background:var(--card-bg);width:100%;max-width:450px;max-height:80vh;border-radius:12px;border:1px solid var(--border-color);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.8)}.modal-header{padding:15px;border-bottom:1px solid var(--border-color);display:flex;justify-content:space-between;align-items:center;background:#161616}.modal-header h4{margin:0;font-size:15px;color:var(--accent-blue)}.btn-close-modal{background:transparent;border:none;color:var(--text-sub);font-size:18px;cursor:pointer}.modal-body{padding:15px;overflow-y:auto;display:flex;flex-direction:column;gap:10px}.content-area{flex:1;display:flex;flex-direction:column;height:100%;position:relative;z-index:1}#map{flex:1;width:100%;height:100%;background:#000}.stats-panel{background:var(--card-bg);border-top:1px solid var(--border-color);padding:12px 15px;display:none;gap:10px;flex-shrink:0;max-height:40vh;overflow-y:auto}.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;width:100%;margin-bottom:10px}.stat-card{background:#262626;padding:10px;border-radius:8px;border:1px solid #333;text-align:center}.stat-card .val{font-size:14px;font-weight:700;color:var(--accent-blue);margin-top:4px}.stat-card .lbl{font-size:10px;color:var(--text-sub);text-transform:uppercase;letter-spacing:.5px}.incidents-detail-box{background:#222;border:1px solid var(--border-color);border-radius:8px;padding:10px;margin-top:5px}.incidents-detail-title{font-size:11px;font-weight:700;color:var(--warning-color);text-transform:uppercase;margin-bottom:6px}.incident-item{font-size:12px;padding:4px 0;border-bottom:1px solid #333;color:var(--text-main)}.incident-item:last-child{border-bottom:none}.trip-card{background:#222;padding:14px;border-radius:10px;border-left:4px solid var(--accent-blue);cursor:pointer;transition:background .2s}.trip-card:hover{background:#2a2a2a}.trip-card.active{background:#2d382e;border-left-color:var(--success-color)}@media(max-width:768px){.sidebar{width:100%;height:100%;display:flex!important}.content-area{display:none!important;width:100%;height:100%}.main-container.viewing-route .sidebar{display:none!important}.main-container.viewing-route .content-area{display:flex!important}}</style></head><body>
<div id="loginOverlay"><div class="login-box"><h3 style="margin-top:0;">Painel do Gestor</h3><input type="text" id="adminUser" placeholder="Usuário" autocomplete="off"><input type="password" id="adminPass" placeholder="Senha" autocomplete="off"><button onclick="autenticarAdmin()">Acessar Painel</button><div id="adminError"></div></div></div>
<div class="header"><button id="btnBack" class="btn-back" onclick="voltarParaLista()">Voltar pras Rotas</button><h3>Gestão de Frota</h3><span id="statusHeader" style="font-size:11px; color:var(--text-sub);">Selecione uma data</span></div>
<div class="main-container" id="mainContainer"><div class="sidebar" id="sidebar"><button class="btn-finish-all" onclick="encerrarTodasRotas()">🛑 ENCERRAR TODAS AS ROTAS EM ANDAMENTO</button><h4 style="margin:10px 0 0 0; color:var(--accent-blue);">Histórico por Data</h4><div id="dateGroupsList" style="display:flex; flex-direction:column; gap:8px;">Carregando datas...</div></div><div class="content-area" id="contentArea"><div id="map"></div><div class="stats-panel" id="statsPanel"><div class="stats-grid"><div class="stat-card"><div class="lbl">Motorista</div><div class="val" id="valDriver">--</div></div><div class="stat-card"><div class="lbl">Início / Fim</div><div class="val" id="valTimes">--:--</div></div><div class="stat-card"><div class="lbl">Duração</div><div class="val" id="valDuration">--:--</div></div><div class="stat-card"><div class="lbl">KM Inicial / Final</div><div class="val" id="valKmRange">-- / --</div></div><div class="stat-card"><div class="lbl">KM Percorrida</div><div class="val" id="valKmDiff" style="color:var(--success-color);">0 km</div></div><div class="stat-card"><div class="lbl">Média Vel.</div><div class="val" id="valAvgSpeed">0 km/h</div></div><div class="stat-card"><div class="lbl">Máx Vel.</div><div class="val" id="valMaxSpeed" style="color:var(--warning-color);">0 km/h</div></div><div class="stat-card"><div class="lbl">Ocorrências</div><div class="val" id="valIncidentsCount" style="color:var(--danger-color);">0</div></div></div><div class="incidents-detail-box" id="incidentsBox" style="display:none;"><div class="incidents-detail-title">Ocorrências Registradas nesta Viagem:</div><div id="incidentsList"></div></div></div></div></div>
<div class="modal-overlay" id="routesModal"><div class="modal-box"><div class="modal-header"><h4 id="modalTitle">Rotas do Dia</h4><button class="btn-close-modal" onclick="fecharModal()">✕</button></div><div class="modal-body" id="modalRoutesList"></div></div></div>
<script>
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('keydown',e=>{if(e.key==='F12'||(e.ctrlKey&&e.shiftKey&&(e.key==='I'||e.key==='J'))||(e.ctrlKey&&e.key==='U'))e.preventDefault();});
setInterval(()=>{const b=Date.now();debugger;if(Date.now()-b>100)document.body.innerHTML='<h2 style="color:red;text-align:center;margin-top:50px;">Acesso não autorizado.</h2>';},2000);
function exibirErro(a){const b=document.getElementById('adminError');b.innerHTML=a;b.style.display='block'}
function autenticarAdmin(){try{const a=document.getElementById('adminUser'),b=document.getElementById('adminPass');if(!a||!b)return exibirErro("Erro interno: Campos de login não encontrados.");const c=a.value?a.value.trim().toLowerCase():"",d=b.value?b.value.trim():"";if(!c||!d)return exibirErro("Por favor, preencha o usuário e a senha.");const h=d.split("").map(x=>(x.charCodeAt(0)+13).toString(16)).join("");if(c==="althieres"&&h==="4d7370833f3d3f43"){sessionStorage.setItem('fcv_admin','true');document.getElementById('loginOverlay').style.display='none';document.getElementById('adminError').style.display='none'}else{exibirErro("Usuário ou senha incorretos!")}}catch(e){exibirErro("Erro ao autenticar: "+e.message)}}
try{if(sessionStorage.getItem('fcv_admin')==='true')document.getElementById('loginOverlay').style.display='none'}catch(e){console.warn("Sessão não verificada.")}
let db=null;try{const f={apiKey:"AIzaSyCDmRsBA8z08E3mbf4EUHIO8Rb02pV5Bcg",authDomain:"rotasfcv.firebaseapp.com",databaseURL:"https://rotasfcv-default-rtdb.firebaseio.com",projectId:"rotasfcv",storageBucket:"rotasfcv.firebasestorage.app",messagingSenderId:"235141426187",appId:"1:235141426187:web:2092de8f43081bb2a4eb0e"};if(!firebase.apps.length)firebase.initializeApp(f);db=firebase.database()}catch(e){exibirErro("Erro no Firebase: "+e.message)}
let map=null,trajetoLayerGroup=null,todasViagensAgrupadas={};
function inicializarMapa(){if(!map){map=L.map('map',{zoomControl:!1}).setView([-20.7933,-42.3683],13);L.control.zoom({position:'topright'}).addTo(map);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(map);trajetoLayerGroup=L.layerGroup().addTo(map)}}
if(db){db.ref('historico_viagens').on('value',a=>{const b=a.val(),c=document.getElementById('dateGroupsList');c.innerHTML="";todasViagensAgrupadas={};if(!b)return c.innerHTML="Nenhuma viagem registrada.";Object.keys(b).forEach(d=>{const e=b[d];e.key=d;const f=new Date(e.inicio),g=f.toLocaleDateString('pt-BR');if(!todasViagensAgrupadas[g])todasViagensAgrupadas[g]=[];todasViagensAgrupadas[g].push(e)});const d=Object.keys(todasViagensAgrupadas).sort((e,f)=>{const g=e.split('/').reverse().join(''),h=f.split('/').reverse().join('');return h.localeCompare(g)});d.forEach(e=>{const f=todasViagensAgrupadas[e].length;let g=document.createElement('button');g.className='date-group-btn';g.innerHTML=`<span>📅 ${e}</span><span class="date-badge">${f} ${f===1?'viagem':'viagens'}</span>`;g.onclick=()=>abrirJanelaRotasDoDia(e);c.appendChild(g)})})}
function abrirJanelaRotasDoDia(a){const b=todasViagensAgrupadas[a]||[];document.getElementById('modalTitle').innerText=`Rotas de ${a}`;const c=document.getElementById('modalRoutesList');c.innerHTML="";b.sort((d,e)=>e.inicio-d.inicio);b.forEach(d=>{const e=new Date(d.inicio).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}),f=d.fim?'<span style="color:#4caf50;">Finalizada</span>':'<span style="color:#ff9800;">Em andamento</span>';let g=document.createElement('div');g.className="trip-card";g.innerHTML=`<div style="font-size:14px; font-weight:bold; color:#fff;">${d.rotaNome||'Rota'} (${d.placa||'FCV'})</div><div style="font-size:12px; color:#00a6fb; margin-top:2px;">👨‍✈️ Motorista: ${d.motoristaNome||d.motorista||'Não informado'}</div><div style="font-size:11px; color:#aaa; margin-top:4px;">Início: ${e}</div><div style="font-size:11px; margin-top:2px;">Status: ${f}</div>`;g.onclick=()=>{fecharModal();carregarRotaNoMapa(d,g)};c.appendChild(g)});document.getElementById('routesModal').style.display='flex'}
function fecharModal(){document.getElementById('routesModal').style.display='none'}
function carregarRotaNoMapa(a,b){document.querySelectorAll('.trip-card').forEach(c=>c.classList.remove('active'));if(b)b.classList.add('active');document.getElementById('mainContainer').classList.add('viewing-route');document.getElementById('btnBack').style.display='inline-block';inicializarMapa();trajetoLayerGroup.clearLayers();if(!a.pontosTrajeto)return alert("Esta viagem não possui pontos de trajeto registrados.");const c=Object.values(a.pontosTrajeto),d=[];let e=0,f=0,g=0,h=[];c.forEach((i,j)=>{const k=[i.lat,i.lng];d.push(k);const l=i.velocidade||0;e+=l;if(l>f)f=l;const m=new Date(i.timestamp).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});if(j===0)L.marker(k).addTo(trajetoLayerGroup).bindPopup(`<b>Início da Viagem</b><br>Horário: ${m}`);if(j===c.length-1&&a.fim)L.marker(k).addTo(trajetoLayerGroup).bindPopup(`<b>Fim da Viagem</b><br>Horário: ${m}`);if(j>0&&(i.timestamp-g>=3e5)){L.circleMarker(k,{radius:5,color:'#00a6fb',fillColor:'#fff',fillOpacity:1}).addTo(trajetoLayerGroup).bindPopup(`<b>Ponto de Passagem</b><br>Horário: ${m}<br>Velocidade: ${l} km/h`);g=i.timestamp}if(i.ocorrencia){let n=i.ocorrencia==='acidente'?'Trânsito / Acidente à Frente':'Ônibus com Defeito';h.push({tipo:n,hora:m,lat:i.lat,lng:i.lng});L.circleMarker(k,{radius:8,color:'#ff5252',fillColor:'#ff5252',fillOpacity:.9}).addTo(trajetoLayerGroup).bindPopup(`<b>ALERTA: ${n.toUpperCase()}</b><br>Horário: ${m}<br>Coordenadas: ${i.lat.toFixed(4)}, ${i.lng.toFixed(4)}`)}});const i=L.polyline(d,{color:'#00a6fb',weight:5,opacity:.8}).addTo(trajetoLayerGroup);setTimeout(()=>{map.invalidateSize();map.fitBounds(i.getBounds(),{padding:[30,30]})},200);document.getElementById('valDriver').innerText=a.motoristaNome||a.motorista||'N/I';const j=new Date(a.inicio).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}),k=a.fim?new Date(a.fim).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):'Em andamento';document.getElementById('valTimes').innerText=`${j} - ${k}`;const l=a.kmInicial!==undefined?a.kmInicial:'--',m=a.kmFinal!==undefined?a.kmFinal:'--';document.getElementById('valKmRange').innerText=`${l} / ${m}`;if(a.kmInicial!==undefined&&a.kmFinal!==undefined){const n=a.kmFinal-a.kmInicial;document.getElementById('valKmDiff').innerText=`${n>=0?n:0} km`}else{document.getElementById('valKmDiff').innerText=`--`}const o=Math.round(e/c.length)||0;document.getElementById('valAvgSpeed').innerText=`${o} km/h`;document.getElementById('valMaxSpeed').innerText=`${f} km/h`;const p=a.fim||Date.now(),q=Math.floor((p-a.inicio)/1000),r=Math.floor(q/60),s=Math.floor(r/60);document.getElementById('valDuration').innerText=s>0?`${s}h ${r%60}m`:`${r} min`;const t=document.getElementById('valIncidentsCount'),u=document.getElementById('incidentsBox'),v=document.getElementById('incidentsList');t.innerText=h.length;if(h.length>0){u.style.display='block';v.innerHTML="";h.forEach(w=>{let x=document.createElement('div');x.className="incident-item";x.innerHTML=`<b>[${w.hora}]</b> ${w.tipo} - <span style="color:#aaa;">(${w.lat.toFixed(4)}, ${w.lng.toFixed(4)})</span>`;v.appendChild(x)})}else{u.style.display='none'}document.getElementById('statsPanel').style.display='block';document.getElementById('statusHeader').innerText=`${a.rotaNome||'Rota'} (${c.length} pontos)`}
function voltarParaLista(){document.getElementById('mainContainer').classList.remove('viewing-route');document.getElementById('statsPanel').style.display='none';document.getElementById('btnBack').style.display='none';document.getElementById('statusHeader').innerText="Selecione uma data"}
function encerrarTodasRotas(){if(!confirm("Tem certeza que deseja encerrar TODAS as rotas em andamento ou pendentes no sistema?"))return;if(!db)return;db.ref('historico_viagens').once('value',a=>{const b=a.val();if(!b)return alert("Nenhuma rota encontrada.");let c={},d=0;const e=Date.now();Object.keys(b).forEach(f=>{if(!b[f].fim){c[`historico_viagens/${f}/fim`]=e;d++}});if(d>0){db.ref().update(c).then(()=>{alert(`Sucesso! ${d} rota(s) que estavam abertas/bugadas foram finalizadas.`)}).catch(f=>{alert("Erro ao encerrar rotas: "+f.message)})}else{alert("Todas as rotas já estão devidamente finalizadas!")}})}
</script></body></html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Painel do Gestor - FCV</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        :root {
            --bg-dark: #121212;
            --card-bg: #1e1e1e;
            --accent-blue: #00a6fb;
            --border-color: #333333;
            --text-main: #ffffff;
            --text-sub: #aaaaaa;
            --danger-color: #ff5252;
            --warning-color: #ff9800;
            --success-color: #4caf50;
        }

        * { box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0; padding: 0;
            background-color: var(--bg-dark);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* OVERLAY DE LOGIN */
        #loginOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #003a63 0%, #0077b6 100%);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 99999; padding: 20px;
        }

        .login-box {
            background: var(--card-bg);
            padding: 25px; border-radius: 16px; width: 100%; max-width: 320px;
            text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .login-box input {
            width: 100%; padding: 12px; margin: 8px 0;
            border-radius: 8px; border: 1px solid var(--border-color);
            background: #2a2a2a; color: #fff; font-size: 14px; outline: none;
        }

        .login-box button {
            width: 100%; padding: 12px; background: var(--accent-blue);
            border: none; color: #fff; font-weight: bold; border-radius: 8px;
            cursor: pointer; font-size: 15px; margin-top: 10px;
        }

        /* HEADER PRINCIPAL */
        .header {
            background: var(--card-bg);
            padding: 12px 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
            height: 55px;
            flex-shrink: 0;
            z-index: 1000;
        }

        .header h3 { margin: 0; font-size: 16px; color: #fff; }

        .btn-back {
            background: #2a2a2a;
            color: #fff;
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            display: none;
        }

        /* LAYOUT PRINCIPAL */
        .main-container {
            display: flex;
            flex: 1;
            height: calc(100vh - 55px);
            position: relative;
            overflow: hidden;
        }

        /* PAINEL DE ROTAS / SIDEBAR */
        .sidebar {
            width: 340px;
            background: #161616;
            border-right: 1px solid var(--border-color);
            padding: 15px;
            overflow-y: auto;
            flex-shrink: 0;
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* BOTÃO DE ENCERRAMENTO GLOBAL */
        .btn-finish-all {
            width: 100%;
            background: rgba(255, 82, 82, 0.15);
            color: var(--danger-color);
            border: 1px solid var(--danger-color);
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn-finish-all:hover {
            background: var(--danger-color);
            color: #fff;
        }

        /* BOTÕES DE DATA GRUPOS */
        .date-group-btn {
            background: #222222;
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 12px 14px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            font-weight: bold;
            transition: background 0.2s;
        }

        .date-group-btn:hover {
            background: #2d2d2d;
            border-color: var(--accent-blue);
        }

        .date-badge {
            background: var(--accent-blue);
            color: #fff;
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 12px;
        }

        /* MODAL / JANELA DAS ROTAS DO DIA */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            padding: 15px;
        }

        .modal-box {
            background: var(--card-bg);
            width: 100%;
            max-width: 450px;
            max-height: 80vh;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        .modal-header {
            padding: 15px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #161616;
        }

        .modal-header h4 { margin: 0; font-size: 15px; color: var(--accent-blue); }

        .btn-close-modal {
            background: transparent;
            border: none;
            color: var(--text-sub);
            font-size: 18px;
            cursor: pointer;
        }

        .modal-body {
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* ÁREA DO MAPA E DETALHES */
        .content-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            position: relative;
            z-index: 1;
        }

        #map {
            flex: 1;
            width: 100%;
            height: 100%;
            background: #000;
        }

        /* PAINEL DE ESTATÍSTICAS E OCORRÊNCIAS */
        .stats-panel {
            background: var(--card-bg);
            border-top: 1px solid var(--border-color);
            padding: 12px 15px;
            display: none;
            gap: 10px;
            flex-shrink: 0;
            max-height: 40vh;
            overflow-y: auto;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 10px;
            width: 100%;
            margin-bottom: 10px;
        }

        .stat-card {
            background: #262626;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #333;
            text-align: center;
        }

        .stat-card .val {
            font-size: 15px;
            font-weight: bold;
            color: var(--accent-blue);
            margin-top: 4px;
        }

        .stat-card .lbl {
            font-size: 10px;
            color: var(--text-sub);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* LISTA DE OCORRÊNCIAS */
        .incidents-detail-box {
            background: #222;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px;
            margin-top: 5px;
        }

        .incidents-detail-title {
            font-size: 11px;
            font-weight: bold;
            color: var(--warning-color);
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .incident-item {
            font-size: 12px;
            padding: 4px 0;
            border-bottom: 1px solid #333;
            color: var(--text-main);
        }

        .incident-item:last-child {
            border-bottom: none;
        }

        .trip-card {
            background: #222222;
            padding: 14px;
            border-radius: 10px;
            border-left: 4px solid var(--accent-blue);
            cursor: pointer;
            transition: background 0.2s;
        }

        .trip-card:hover {
            background: #2a2a2a;
        }

        .trip-card.active {
            background: #2d382e;
            border-left-color: var(--success-color);
        }

        /* REGRAS RÍGIDAS DE ISOLAMENTO MOBILE */
        @media (max-width: 768px) {
            .sidebar {
                width: 100%;
                height: 100%;
                display: flex !important;
            }

            .content-area {
                display: none !important;
                width: 100%;
                height: 100%;
            }

            .main-container.viewing-route .sidebar {
                display: none !important;
            }

            .main-container.viewing-route .content-area {
                display: flex !important;
            }
        }
    </style>
</head>
<body>

    <div id="loginOverlay">
        <div class="login-box">
            <h3 style="margin-top:0;">Painel do Gestor</h3>
            <input type="text" id="adminUser" placeholder="Usuário">
            <input type="password" id="adminPass" placeholder="Senha">
            <button onclick="autenticarAdmin()">Acessar Painel</button>
            <div id="adminError" style="color:var(--danger-color); display:none; margin-top:10px; font-size:12px;">Dados incorretos!</div>
        </div>
    </div>

    <div class="header">
        <button id="btnBack" class="btn-back" onclick="voltarParaLista()">Voltar pras Rotas</button>
        <h3>Gestão de Frota</h3>
        <span id="statusHeader" style="font-size:11px; color:var(--text-sub);">Selecione uma data</span>
    </div>

    <div class="main-container" id="mainContainer">
        <!-- BARRA LATERAL COM BOTÃO MASTER E GRUPOS DE DATAS -->
        <div class="sidebar" id="sidebar">
            <button class="btn-finish-all" onclick="encerrarTodasRotas()">
                🛑 ENCERRAR TODAS AS ROTAS EM ANDAMENTO
            </button>

            <h4 style="margin:10px 0 0 0; color:var(--accent-blue);">Histórico por Data</h4>
            <div id="dateGroupsList" style="display:flex; flex-direction:column; gap:8px;">
                Carregando datas...
            </div>
        </div>

        <!-- ÁREA DO MAPA E ESTATÍSTICAS -->
        <div class="content-area" id="contentArea">
            <div id="map"></div>
            
            <div class="stats-panel" id="statsPanel">
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="lbl">Média Vel.</div>
                        <div class="val" id="valAvgSpeed">0 km/h</div>
                    </div>
                    <div class="stat-card">
                        <div class="lbl">Máx Vel.</div>
                        <div class="val" id="valMaxSpeed" style="color:var(--warning-color);">0 km/h</div>
                    </div>
                    <div class="stat-card">
                        <div class="lbl">Duração</div>
                        <div class="val" id="valDuration">--:--</div>
                    </div>
                    <div class="stat-card">
                        <div class="lbl">Ocorrências</div>
                        <div class="val" id="valIncidentsCount" style="color:var(--danger-color);">0</div>
                    </div>
                </div>

                <div class="incidents-detail-box" id="incidentsBox" style="display:none;">
                    <div class="incidents-detail-title">Ocorrências Registradas nesta Viagem:</div>
                    <div id="incidentsList"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- JANELA MODAL PARA ROTAS DO DIA SELECIONADO -->
    <div class="modal-overlay" id="routesModal">
        <div class="modal-box">
            <div class="modal-header">
                <h4 id="modalTitle">Rotas do Dia</h4>
                <button class="btn-close-modal" onclick="fecharModal()">✕</button>
            </div>
            <div class="modal-body" id="modalRoutesList">
                <!-- Rotas serão inseridas aqui dinamicamente -->
            </div>
        </div>
    </div>

    <script>
        function autenticarAdmin() {
            if (document.getElementById('adminUser').value === "Althieres" && document.getElementById('adminPass').value === "admin123") {
                sessionStorage.setItem('fcv_admin', 'true');
                document.getElementById('loginOverlay').style.display = 'none';
            } else {
                document.getElementById('adminError').style.display = 'block';
            }
        }
        if (sessionStorage.getItem('fcv_admin') === 'true') document.getElementById('loginOverlay').style.display = 'none';

        const firebaseConfig = {
            apiKey: "AIzaSyCDmRsBA8z08E3mbf4EUHIO8Rb02pV5Bcg",
            authDomain: "rotasfcv.firebaseapp.com",
            databaseURL: "https://rotasfcv-default-rtdb.firebaseio.com",
            projectId: "rotasfcv",
            storageBucket: "rotasfcv.firebasestorage.app",
            messagingSenderId: "235141426187",
            appId: "1:235141426187:web:2092de8f43081bb2a4eb0e"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let map = null;
        let trajetoLayerGroup = null;
        let todasViagensAgrupadas = {};

        function inicializarMapa() {
            if (!map) {
                map = L.map('map', { zoomControl: false }).setView([-20.7933, -42.3683], 13);
                L.control.zoom({ position: 'topright' }).addTo(map);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);
                trajetoLayerGroup = L.layerGroup().addTo(map);
            }
        }

        // ESCOUTA EM TEMPO REAL E AGRUPA POR DATA
        db.ref('historico_viagens').on('value', (snapshot) => {
            const data = snapshot.val();
            const dateGroupsEl = document.getElementById('dateGroupsList');
            dateGroupsEl.innerHTML = "";
            todasViagensAgrupadas = {};

            if (!data) {
                dateGroupsEl.innerHTML = "Nenhuma viagem registrada.";
                return;
            }

            // Separar as viagens pelas suas datas de início
            Object.keys(data).forEach(key => {
                const viagem = data[key];
                viagem.key = key; // Salva a chave do Firebase

                const dataObj = new Date(viagem.inicio);
                const dataChave = dataObj.toLocaleDateString('pt-BR'); // Ex: 29/07/2026

                if (!todasViagensAgrupadas[dataChave]) {
                    todasViagensAgrupadas[dataChave] = [];
                }
                todasViagensAgrupadas[dataChave].push(viagem);
            });

            // Ordenar as datas da mais recente para a mais antiga
            const datasOrdenadas = Object.keys(todasViagensAgrupadas).sort((a, b) => {
                const pA = a.split('/').reverse().join('');
                const pB = b.split('/').reverse().join('');
                return pB.localeCompare(pA);
            });

            datasOrdenadas.forEach(dataStr => {
                const qtdViagens = todasViagensAgrupadas[dataStr].length;
                
                let btn = document.createElement('button');
                btn.className = 'date-group-btn';
                btn.innerHTML = `
                    <span>📅 ${dataStr}</span>
                    <span class="date-badge">${qtdViagens} ${qtdViagens === 1 ? 'viagem' : 'viagens'}</span>
                `;
                btn.onclick = () => abrirJanelaRotasDoDia(dataStr);
                dateGroupsEl.appendChild(btn);
            });
        });

        // ABRIR JANELA COM AS ROTAS DA DATA SELECIONADA
        function abrirJanelaRotasDoDia(dataStr) {
            const viagensDoDia = todasViagensAgrupadas[dataStr] || [];
            document.getElementById('modalTitle').innerText = `Rotas de ${dataStr}`;
            
            const listEl = document.getElementById('modalRoutesList');
            listEl.innerHTML = "";

            // Ordenar viagens dentro do dia (mais recentes primeiro)
            viagensDoDia.sort((a, b) => b.inicio - a.inicio);

            viagensDoDia.forEach(viagem => {
                const inicioStr = new Date(viagem.inicio).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
                const statusTexto = viagem.fim ? '<span style="color:#4caf50;">Finalizada</span>' : '<span style="color:#ff9800;">Em andamento</span>';

                let card = document.createElement('div');
                card.className = "trip-card";
                card.innerHTML = `
                    <div style="font-size:14px; font-weight:bold; color:#fff;">${viagem.rotaNome || 'Rota'} (${viagem.placa || 'FCV'})</div>
                    <div style="font-size:11px; color:#aaa; margin-top:4px;">Início: ${inicioStr}</div>
                    <div style="font-size:11px; margin-top:2px;">Status: ${statusTexto}</div>
                `;
                card.onclick = () => {
                    fecharModal();
                    carregarRotaNoMapa(viagem, card);
                };
                listEl.appendChild(card);
            });

            document.getElementById('routesModal').style.display = 'flex';
        }

        function fecharModal() {
            document.getElementById('routesModal').style.display = 'none';
        }

        // CARREGAR A ROTA NO MAPA
        function carregarRotaNoMapa(viagem, cardElement) {
            document.querySelectorAll('.trip-card').forEach(c => c.classList.remove('active'));
            if (cardElement) cardElement.classList.add('active');

            document.getElementById('mainContainer').classList.add('viewing-route');
            document.getElementById('btnBack').style.display = 'inline-block';

            inicializarMapa();
            trajetoLayerGroup.clearLayers();

            if (!viagem.pontosTrajeto) {
                alert("Esta viagem não possui pontos de trajeto registrados.");
                return;
            }

            const pontos = Object.values(viagem.pontosTrajeto);
            const latLngs = [];
            let somaVelocidade = 0;
            let maxVelocidade = 0;
            let ultimoTempoMarcador = 0;
            let listaOcorrencias = [];

            pontos.forEach((p, index) => {
                const pos = [p.lat, p.lng];
                latLngs.push(pos);

                const speed = p.velocidade || 0;
                somaVelocidade += speed;
                if (speed > maxVelocidade) maxVelocidade = speed;

                const horaFormatada = new Date(p.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});

                // 1. Marca Ponto de Início
                if (index === 0) {
                    L.marker(pos).addTo(trajetoLayerGroup)
                        .bindPopup(`<b>Início da Viagem</b><br>Horário: ${horaFormatada}`);
                }

                // 2. Marca Ponto de Fim
                if (index === pontos.length - 1 && viagem.fim) {
                    L.marker(pos).addTo(trajetoLayerGroup)
                        .bindPopup(`<b>Fim da Viagem</b><br>Horário: ${horaFormatada}`);
                }

                // 3. Ponto de controle a cada 5 minutos
                if (index > 0 && (p.timestamp - ultimoTempoMarcador >= 300000)) {
                    L.circleMarker(pos, { radius: 5, color: '#00a6fb', fillColor: '#fff', fillOpacity: 1 }).addTo(trajetoLayerGroup)
                        .bindPopup(`<b>Ponto de Passagem</b><br>Horário: ${horaFormatada}<br>Velocidade: ${speed} km/h`);
                    ultimoTempoMarcador = p.timestamp;
                }

                // 4. Mapear Ocorrências
                if (p.ocorrencia) {
                    let tipoTexto = p.ocorrencia === 'acidente' ? 'Trânsito / Acidente à Frente' : 'Ônibus com Defeito';
                    listaOcorrencias.push({
                        tipo: tipoTexto,
                        hora: horaFormatada,
                        lat: p.lat,
                        lng: p.lng
                    });

                    L.circleMarker(pos, { radius: 8, color: '#ff5252', fillColor: '#ff5252', fillOpacity: 0.9 }).addTo(trajetoLayerGroup)
                        .bindPopup(`<b>ALERTA: ${tipoTexto.toUpperCase()}</b><br>Horário: ${horaFormatada}<br>Coordenadas: ${p.lat.toFixed(4)}, ${p.lng.toFixed(4)}`);
                }
            });

            // Desenhar linha da rota
            const polyline = L.polyline(latLngs, { color: '#00a6fb', weight: 5, opacity: 0.8 }).addTo(trajetoLayerGroup);
            
            setTimeout(() => {
                map.invalidateSize();
                map.fitBounds(polyline.getBounds(), { padding: [30, 30] });
            }, 200);

            // CALCULAR ESTATÍSTICAS
            const mediaVel = Math.round(somaVelocidade / pontos.length) || 0;
            document.getElementById('valAvgSpeed').innerText = `${mediaVel} km/h`;
            document.getElementById('valMaxSpeed').innerText = `${maxVelocidade} km/h`;

            // CALCULAR DURAÇÃO
            const tempoFim = viagem.fim || Date.now();
            const duracaoSegs = Math.floor((tempoFim - viagem.inicio) / 1000);
            const mins = Math.floor(duracaoSegs / 60);
            const hrs = Math.floor(mins / 60);
            document.getElementById('valDuration').innerText = hrs > 0 ? `${hrs}h ${mins % 60}m` : `${mins} min`;

            // PAINEL DE OCORRÊNCIAS
            const countIncEl = document.getElementById('valIncidentsCount');
            const boxIncEl = document.getElementById('incidentsBox');
            const listIncEl = document.getElementById('incidentsList');

            countIncEl.innerText = listaOcorrencias.length;

            if (listaOcorrencias.length > 0) {
                boxIncEl.style.display = 'block';
                listIncEl.innerHTML = "";
                listaOcorrencias.forEach(item => {
                    let div = document.createElement('div');
                    div.className = "incident-item";
                    div.innerHTML = `<b>[${item.hora}]</b> ${item.tipo} - <span style="color:#aaa;">(${item.lat.toFixed(4)}, ${item.lng.toFixed(4)})</span>`;
                    listIncEl.appendChild(div);
                });
            } else {
                boxIncEl.style.display = 'none';
            }

            document.getElementById('statsPanel').style.display = 'block';
            document.getElementById('statusHeader').innerText = `${viagem.rotaNome || 'Rota'} (${pontos.length} pontos)`;
        }

        function voltarParaLista() {
            document.getElementById('mainContainer').classList.remove('viewing-route');
            document.getElementById('statsPanel').style.display = 'none';
            document.getElementById('btnBack').style.display = 'none';
            document.getElementById('statusHeader').innerText = "Selecione uma data";
        }

        // FUNÇÃO MASTER PARA ENCERRAR TODAS AS ROTAS ABERTAS/BUGADAS
        function encerrarTodasRotas() {
            if (!confirm("Tem certeza que deseja encerrar TODAS as rotas em andamento ou pendentes no sistema?")) {
                return;
            }

            db.ref('historico_viagens').once('value', (snapshot) => {
                const data = snapshot.val();
                if (!data) {
                    alert("Nenhuma rota encontrada.");
                    return;
                }

                let updates = {};
                let quantidadeEncerrada = 0;
                const agora = Date.now();

                Object.keys(data).forEach(key => {
                    if (!data[key].fim) {
                        updates[`historico_viagens/${key}/fim`] = agora;
                        quantidadeEncerrada++;
                    }
                });

                if (quantidadeEncerrada > 0) {
                    db.ref().update(updates)
                        .then(() => {
                            alert(`Sucesso! ${quantidadeEncerrada} rota(s) que estavam abertas/bugadas foram finalizadas.`);
                        })
                        .catch((err) => {
                            alert("Erro ao encerrar rotas: " + err.message);
                        });
                } else {
                    alert("Todas as rotas já estão devidamente finalizadas!");
                }
            });
        }
    </script>
</body>
</html>

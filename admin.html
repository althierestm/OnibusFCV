<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Painel do Gestor - FCV</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        :root {
            --bg-dark: #121212;
            --card-bg: #1e1e1e;
            --accent-blue: #00a6fb;
            --border-color: #333333;
            --text-main: #ffffff;
            --text-sub: #aaaaaa;
            --danger-color: #ff5252;
            --warning-color: #ff9800;
            --success-color: #4caf50;
        }

        * { box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0; padding: 0;
            background-color: var(--bg-dark);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        #loginOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #003a63 0%, #0077b6 100%);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 99999; padding: 20px;
        }

        .login-box {
            background: var(--card-bg);
            padding: 25px; border-radius: 16px; width: 100%; max-width: 320px;
            text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .login-box input {
            width: 100%; padding: 12px; margin: 8px 0;
            border-radius: 8px; border: 1px solid var(--border-color);
            background: #2a2a2a; color: #fff; font-size: 14px; outline: none;
        }

        .login-box button {
            width: 100%; padding: 12px; background: var(--accent-blue);
            border: none; color: #fff; font-weight: bold; border-radius: 8px;
            cursor: pointer; font-size: 15px; margin-top: 10px;
        }

        .header {
            background: var(--card-bg);
            padding: 12px 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
            height: 55px;
            flex-shrink: 0;
            z-index: 1000;
        }

        .header h3 { margin: 0; font-size: 16px; color: #fff; }

        .btn-back {
            background: #2a2a2a;
            color: #fff;
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            display: none;
        }

        .main-container {
            display: flex;
            flex: 1;
            height: calc(100vh - 55px);
            position: relative;
            overflow: hidden;
        }

        .sidebar {
            width: 340px;
            background: #161616;
            border-right: 1px solid var(--border-color);
            padding: 15px;
            overflow-y: auto;
            flex-shrink: 0;
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn-finish-all {
            width: 100%;
            background: rgba(255, 82, 82, 0.15);
            color: var(--danger-color);
            border: 1px solid var(--danger-color);
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn-finish-all:hover {
            background: var(--danger-color);
            color: #fff;
        }

        .date-group-btn {
            background: #222222;
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 12px 14px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            font-weight: bold;
            transition: background 0.2s;
        }

        .date-group-btn:hover {
            background: #2d2d2d;
            border-color: var(--accent-blue);
        }

        .date-badge {
            background: var(--accent-blue);
            color: #fff;
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 12px;
        }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            padding: 15px;
        }

        .modal-box {
            background: var(--card-bg);
            width: 100%;
            max-width: 450px;
            max-height: 80vh;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        .modal-header {
            padding: 15px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #161616;
        }

        .modal-header h4 { margin: 0; font-size: 15px; color: var(--accent-blue); }

        .btn-close-modal {
            background: transparent;
            border: none;
            color: var(--text-sub);
            font-size: 18px;
            cursor: pointer;
        }

        .modal-body {
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .content-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            position: relative;
            z-index: 1;
        }

        #map {
            flex: 1;
            width: 100%;
            height: 100%;
            background: #000;
        }

        .stats-panel {
            background: var(--card-bg);
            border-top: 1px solid var(--border-color);
            padding: 12px 15px;
            display: none;
            gap: 10px;
            flex-shrink: 0;
            max-height: 40vh;
            overflow-y: auto;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 10px;
            width: 100%;
            margin-bottom: 10px;
        }

        .stat-card {
            background: #262626;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #333;
            text-align: center;
        }

        .stat-card .val {
            font-size: 15px;
            font-weight: bold;
            color: var(--accent-blue);
            margin-top: 4px;
        }

        .stat-card .lbl {
            font-size: 10px;
            color: var(--text-sub);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .incidents-detail-box {
            background: #222;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px;
            margin-top: 5px;
        }

        .incidents-detail-title {
            font-size: 11px;
            font-weight: bold;
            color: var(--warning-color);
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .incident-item {
            font-size: 12px;
            padding: 4px 0;
            border-bottom: 1px solid #333;
            color: var(--text-main);
        }

        .incident-item:last-child {
            border-bottom: none;
        }

        .trip-card {
            background: #222222;
            padding: 14px;
            border-radius: 10px;
            border-left: 4px solid var(--accent-blue);
            cursor: pointer;
            transition: background 0.2s;
        }

        .trip-card:hover {
            background: #2a2a2a;
        }

        .trip-card.active {
            background: #2d382e;
            border-left-color: var(--success-color);
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 100%;
                height: 100%;
                display: flex !important;
            }

            .content-area {
                display: none !important;
                width: 100%;
                height: 100%;
            }

            .main-container.viewing-route .sidebar {
                display: none !important;
            }

            .main-container.viewing-route .content-area {
                display: flex !important;
            }
        }
    </style>
</head>
<body>

    <div id="loginOverlay">
        <div class="login-box">
            <h3 style="margin-top:0;">Painel do Gestor</h3>
            <input type="text" id="adminUser" placeholder="Usuário">
            <input type="password" id="adminPass" placeholder="Senha">
            <button onclick="autenticarAdmin()">Acessar Painel</button>
            <div id="adminError" style="color:var(--danger-color); display:none; margin-top:10px; font-size:12px;">Dados incorretos!</div>
        </div>
    </div>

    <div class="header">
        <button id="btnBack" class="btn-back" onclick="voltarParaLista()">Voltar pras Rotas</button>
        <h3>Gestão de Frota</h3>
        <span id="statusHeader" style="font-size:11px; color:var(--text-sub);">Selecione uma data</span>
    </div>

    <div class="main-container" id="mainContainer">
        <div class="sidebar" id="sidebar">
            <button class="btn-finish-all" onclick="encerrarTodasRotas()">
                🛑 ENCERRAR TODAS AS ROTAS EM ANDAMENTO
            </button>

            <h4 style="margin:10px 0 0 0; color:var(--accent-blue);">Histórico por Data</h4>
            <div id="dateGroupsList" style="display:flex; flex-direction:column; gap:8px;">
                Carregando datas...
            </div>
        </div>

        <div class="content-area" id="contentArea">
            <div id="map"></div>
            
            <div class="stats-panel" id="statsPanel">
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="lbl">Média Vel.</div>
                        <div class="val" id="valAvgSpeed">0 km/h</div>
                    </div>
                    <div class="stat-card">
                        <div class="lbl">Máx Vel.</div>
                        <div class="val" id="valMaxSpeed" style="color:var(--warning-color);">0 km/h</div>
                    </div>
                    <div class="stat-card">
                        <div class="lbl">Duração</div>
                        <div class="val" id="valDuration">--:--</div>
                    </div>
                    <div class="stat-card">
                        <div class="lbl">Ocorrências</div>
                        <div class="val" id="valIncidentsCount" style="color:var(--danger-color);">0</div>
                    </div>
                </div>

                <div class="incidents-detail-box" id="incidentsBox" style="display:none;">
                    <div class="incidents-detail-title">Ocorrências Registradas nesta Viagem:</div>
                    <div id="incidentsList"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="routesModal">
        <div class="modal-box">
            <div class="modal-header">
                <h4 id="modalTitle">Rotas do Dia</h4>
                <button class="btn-close-modal" onclick="fecharModal()">✕</button>
            </div>
            <div class="modal-body" id="modalRoutesList"></div>
        </div>
    </div>

</body>

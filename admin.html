<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Gestor - FCV</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #121212; color: #fff; }
        #loginOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #003a63; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999;
        }
        .login-box { background: #1e1e1e; padding: 25px; border-radius: 12px; width: 300px; text-align: center; }
        .login-box input { width: 100%; padding: 10px; margin: 8px 0; box-sizing: border-box; border-radius: 6px; border: 1px solid #333; background: #2a2a2a; color: #fff; }
        .login-box button { width: 100%; padding: 12px; background: #00a6fb; border: none; color: #fff; font-weight: bold; border-radius: 6px; cursor: pointer; }
        
        .header { background: #1e1e1e; padding: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; }
        .main-container { display: flex; height: calc(100vh - 60px); }
        .sidebar { width: 350px; background: #181818; border-right: 1px solid #333; padding: 15px; overflow-y: auto; }
        #map { flex: 1; height: 100%; }

        .trip-card { background: #252525; padding: 12px; border-radius: 8px; margin-bottom: 10px; border-left: 4px solid #00a6fb; cursor: pointer; transition: 0.2s; }
        .trip-card:hover { background: #303030; }
        .trip-card.active { border-left-color: #4caf50; background: #2d382e; }

        .incident-badge { display: inline-block; padding: 3px 8px; border-radius: 12px; font-size: 11px; font-weight: bold; margin-top: 5px; }
        .bg-red { background: #d32f2f; color: white; }
        .bg-orange { background: #f57c00; color: white; }
    </style>
</head>
<body>

    <div id="loginOverlay">
        <div class="login-box">
            <h3>🛡️ Painel do Gestor</h3>
            <input type="text" id="adminUser" placeholder="Usuário">
            <input type="password" id="adminPass" placeholder="Senha">
            <button onclick="autenticarAdmin()">Acessar</button>
            <div id="adminError" style="color:#ff5252; display:none; margin-top:10px; font-size:12px;">Dados incorretos!</div>
        </div>
    </div>

    <div class="header">
        <h3 style="margin:0;">🚌 FCV - Gestão de Frotas & Histórico</h3>
        <span id="statusHeader" style="font-size:12px; color:#aaa;">Selecione uma viagem para visualizar a rota</span>
    </div>

    <div class="main-container">
        <div class="sidebar">
            <h4 style="margin-top:0;">📜 Histórico de Viagens</h4>
            <div id="tripsList">Carregando histórico...</div>
        </div>
        <div id="map"></div>
    </div>

    <script>
        function autenticarAdmin() {
            if (document.getElementById('adminUser').value === "Althieres" && document.getElementById('adminPass').value === "@lthieresTM") {
                sessionStorage.setItem('fcv_admin', 'true');
                document.getElementById('loginOverlay').style.display = 'none';
            } else {
                document.getElementById('adminError').style.display = 'block';
            }
        }
        if (sessionStorage.getItem('fcv_admin') === 'true') document.getElementById('loginOverlay').style.display = 'none';

        const firebaseConfig = {
            apiKey: "AIzaSyCDmRsBA8z08E3mbf4EUHIO8Rb02pV5Bcg",
            authDomain: "rotasfcv.firebaseapp.com",
            databaseURL: "https://rotasfcv-default-rtdb.firebaseio.com",
            projectId: "rotasfcv",
            storageBucket: "rotasfcv.firebasestorage.app",
            messagingSenderId: "235141426187",
            appId: "1:235141426187:web:2092de8f43081bb2a4eb0e"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const map = L.map('map').setView([-20.7933, -42.3683], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

        let trajetoLayerGroup = L.layerGroup().addTo(map);

        db.ref('historico_viagens').on('value', (snapshot) => {
            const data = snapshot.val();
            const tripsListEl = document.getElementById('tripsList');
            tripsListEl.innerHTML = "";

            if (!data) {
                tripsListEl.innerHTML = "Nenhuma viagem encontrada.";
                return;
            }

            const keys = Object.keys(data).reverse();
            keys.forEach(key => {
                const viagem = data[key];
                const inicioStr = new Date(viagem.inicio).toLocaleString([], {dateStyle:'short', timeStyle:'short'});
                
                let card = document.createElement('div');
                card.className = "trip-card";
                card.innerHTML = `
                    <b>${viagem.rotaNome || 'Rota'}</b> (${viagem.placa || 'FCV'})<br>
                    <small>📅 Início: ${inicioStr}</small><br>
                    <small> Status: ${viagem.fim ? '🏁 Finalizada' : '🟢 Em andamento'}</small>
                `;
                card.onclick = () => carregarRotaNoMapa(viagem, card);
                tripsListEl.appendChild(card);
            });
        });

        function carregarRotaNoMapa(viagem, cardElement) {
            document.querySelectorAll('.trip-card').forEach(c => c.classList.remove('active'));
            if(cardElement) cardElement.classList.add('active');

            trajetoLayerGroup.clearLayers();

            if (!viagem.pontosTrajeto) {
                alert("Esta viagem não possui pontos de trajeto registrados.");
                return;
            }

            const pontos = Object.values(viagem.pontosTrajeto);
            const latLngs = [];
            let ultimoTempoMarcador = 0;

            pontos.forEach((p, index) => {
                const pos = [p.lat, p.lng];
                latLngs.push(pos);

                const horaFormatada = new Date(p.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});

                // 1. Marca Ponto de Início
                if (index === 0) {
                    L.marker(pos).addTo(trajetoLayerGroup)
                        .bindPopup(`🚀 <b>Início da Viagem</b><br>Horário: ${horaFormatada}`);
                }

                // 2. Marca Ponto de Fim
                if (index === pontos.length - 1 && viagem.fim) {
                    L.marker(pos).addTo(trajetoLayerGroup)
                        .bindPopup(`🏁 <b>Fim da Viagem</b><br>Horário: ${horaFormatada}`);
                }

                // 3. Marca pontos no mapa a cada 5 Minutos (300.000 ms)
                if (index > 0 && (p.timestamp - ultimoTempoMarcador >= 300000)) {
                    L.circleMarker(pos, { radius: 6, color: '#00a6fb', fillColor: '#fff', fillOpacity: 1 }).addTo(trajetoLayerGroup)
                        .bindPopup(`⏱️ <b>Passagem (5 min)</b><br>Horário: ${horaFormatada}<br>Velocidade: ${p.velocidade} km/h`);
                    ultimoTempoMarcador = p.timestamp;
                }

                // 4. Marca Ocorrências (Acidente ou Ônibus Quebrado)
                if (p.ocorrencia === 'acidente') {
                    L.marker(pos).addTo(trajetoLayerGroup)
                        .bindPopup(`⚠️ <b style="color:red;">ALERTA DE TRÂNSITO / ACIDENTE</b><br>Relatado às: ${horaFormatada}`);
                } else if (p.ocorrencia === 'quebrado') {
                    L.marker(pos).addTo(trajetoLayerGroup)
                        .bindPopup(`🔧 <b style="color:orange;">ÔNIBUS COM DEFEITO</b><br>Relatado às: ${horaFormatada}`);
                }
            });

            // Desenha a linha azul do trajeto percorrido
            const polyline = L.polyline(latLngs, { color: '#00a6fb', weight: 5, opacity: 0.8 }).addTo(trajetoLayerGroup);
            map.fitBounds(polyline.getBounds(), { padding: [30, 30] });

            document.getElementById('statusHeader').innerText = `Exibindo trajeto de ${viagem.rotaNome} (${latLngs.length} pontos gravados)`;
        }
    </script>
</body>
</html>
